<script>
'use strict';
const $=s=>document.querySelector(s), main=$('#main');
const icons={home:'M3 10l9-7 9 7v10h-6v-6H9v6H3z',chat:'M4 4h16v12H9l-5 4z M8 9h1m3 0h1m3 0h1',tasks:'M7 4H4v17h16V4h-3 M8 3h8v4H8z M8 12h8m-8 4h5',approval:'M6 3h12v18H6z M9 12l2 2 4-5',agent:'M8 5V3m8 2V3 M4 6h16v14H4z M8 11h1m6 0h1m-8 5h8',book:'M12 5L3 3v16l9 2 9-2V3z M12 5v16',tools:'M14 5l5-2-2 5 3 3-4 4-3-3-8 8-3-3 8-8-3-3 4-4z',box:'M3 6l9-4 9 4v12l-9 4-9-4z M3 6l9 5 9-5 M12 11v11',calendar:'M5 5h14v16H5z M8 3v4m8-4v4M5 10h14',folder:'M3 6h7l2 3h9v11H3z',chart:'M4 20V4m0 16h17 M8 16v-5m5 5V7m5 9V3',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',bell:'M5 17h14l-2-4V8a5 5 0 0 0-10 0v5z M10 21h4',help:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5m0 4h.01',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12l2 2M4 20l2-2M18 6l2-2',database:'M3 6c0-5 18-5 18 0s-18 5-18 0v6c0 5 18 5 18 0V6 M3 12v6c0 5 18 5 18 0v-6',play:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M10 7l6 5-6 5z',clock:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M12 6v6l4 2',file:'M5 2h9l5 5v15H5z M14 2v6h5 M8 12h8m-8 4h8',upload:'M12 16V3m-5 5l5-5 5 5 M4 15v6h16v-6',trace:'M4 4h4v4H4z M16 16h4v4h-4z M6 8v10h10 M8 6h10v10'};
function icon(name){return `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${icons[name]||icons.file}"/></svg></span>`}
function decorate(){document.querySelectorAll('[data-icon]').forEach(e=>{e.innerHTML=icon(e.dataset.icon);e.removeAttribute('data-icon')})}
const pages=[['dashboard','工作台','home'],['chat','会话','chat'],['runs','任务中心','tasks'],['approvals','审批中心','approval'],['agents','Agent 定义','agent'],['knowledge','知识库','book'],['connections','工具与连接','tools'],['sandboxes','沙盒环境','box'],['schedules','计划任务','calendar'],['artifacts','文件与产物','folder'],['usage','用量与监控','chart'],['settings','系统设置','settings']];
$('#nav').innerHTML=pages.map(([id,label,i])=>`<button data-nav="${id}" title="${label}">${icon(i)}<span class="label">${label}</span></button>`).join('');decorate();
const state={page:'dashboard',sid:null,run:null,generation:0,stream:null,refreshTimer:null,approvalTab:'pending',view:'table'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(value){if(value===null||value===undefined||value==='')return '时间未知';const d=new Date(typeof value==='number'&&value<1e12?value*1000:value);return Number.isNaN(d.getTime())?'时间未知':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
const labels={queued:'排队中',running:'运行中',waiting_approval:'等待审批',paused:'已暂停',retrying:'重试中',completed:'已完成',failed:'失败',cancelled:'已取消',pending:'待审批',approved:'已批准',rejected:'已拒绝',expired:'已过期',available:'可用',unavailable:'不可用',configured:'已配置',not_configured:'未配置',not_probed:'未探测',not_initialized:'未初始化',draft:'草稿',published:'已发布',deprecated:'已废弃',destroyed:'已销毁',orphaned:'待回收',cleanup_failed:'清理失败',inactive:'未激活',indexed:'已索引'};
function badge(s){return `<span class="badge ${['completed','approved','available','published'].includes(s)?'green':['running','queued'].includes(s)?'blue':['waiting_approval','pending','unavailable'].includes(s)?'amber':['failed','rejected','cleanup_failed'].includes(s)?'red':''}">${esc(labels[s]||s)}</span>`}
function empty(title,detail='数据将在实际操作后显示',i='folder'){return `<div class="empty">${icon(i)}<strong>${esc(title)}</strong><p>${esc(detail)}</p></div>`}
function title(t,d='',action=''){return `<div class="page-title"><div><h1>${esc(t)}</h1><p>${esc(d)}</p></div>${action}</div>`}
function btn(label,action,id='',cls=''){return `<button type="button" class="${cls}" data-action="${action}" data-id="${esc(id)}">${esc(label)}</button>`}
function go(page){location.hash=page;if(state.page===page)render()}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4000)}
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(r.status===204)return null;let data;try{data=await r.json()}catch{throw Error(`HTTP ${r.status}：响应不是 JSON`)}if(!r.ok)throw Error(`${data.code||r.status}：${data.message||data.advice||data.detail||'请求失败'}`);return data}
const get=p=>api('/api/v1/'+p),post=(p,b={})=>api('/api/v1/'+p,{method:'POST',body:JSON.stringify(b)});
function modal(name,html){$('#dialogTitle').textContent=name;$('#dialogBody').innerHTML=html;$('#dialog').showModal()}
function markdownPreview(text){return esc(text).split(/\r?\n/).map(line=>{const h=line.match(/^(#{1,6}) (.*)$/);if(h)return `<h${h[1].length}>${h[2]}</h${h[1].length}>`;if(line.startsWith('- '))return `<p>• ${line.slice(2)}</p>`;return `<p style="white-space:pre-wrap">${line||'&nbsp;'}</p>`}).join('')}
function showJSON(name,data){modal(name,`<pre>${esc(JSON.stringify(data,null,2))}</pre>`)}
$('#dialogClose').onclick=()=>$('#dialog').close();
function sessionRows(rows){return rows.length?rows.map(s=>`<div class="row"><span class="bubble purple">${icon('chat')}</span><div class="grow"><a href="#chat" data-session="${esc(s.sid)}"><strong>${esc(s.title||'未命名会话')}</strong></a><p>${esc(s.sid)}</p></div><small>${date(s.updated)}</small></div>`).join(''):empty('还没有会话','新建对话，开始你的第一个 Agent 任务','chat')}
function runError(r){return r?.error_code?`<p class="failure" data-run-error>${esc(({model:'模型错误',tool:'工具错误',approval:'审批拒绝',cancellation:'用户取消',sandbox:'Sandbox 错误',execution:'执行错误'})[r.error_kind]||'执行错误')} · ${esc(r.error_code)}<br>${esc(r.error_message||'')}</p>`:''}
function runRows(rows){return rows.length?rows.map(r=>`<div class="row"><span class="bubble ${r.status==='completed'?'green':''}">${icon('play')}</span><div class="grow"><strong><a href="#runs" data-action="run-detail" data-id="${esc(r.run_id)}">${esc(r.name)}</a></strong><p>${r.current_step} / ${r.total_steps} 个执行步骤</p>${runError(r)}</div>${badge(r.status)}</div>`).join(''):empty('暂无运行任务','任务会在模型开始执行后出现在这里','tasks')}
function healthRows(rows){return rows.map(r=>`<div class="status-row"><i class="dot ${r.status==='available'?'ok':''}"></i><span>${esc(r.component)}</span><span>${badge(r.status)}</span></div>`).join('')}

ction="knowledge-upload">上传文档</button></div><div class="metrics"><div><b>${d.knowledge.count}</b><small>文档数</small></div><div><b>${(d.knowledge.bytes/1024).toFixed(1)} KB</b><small>存储量</small></div><div><b>关键词</b><small>默认 Provider</small></div></div></section><section class="card"><div class="card-head"><h2>模型配置</h2><button class="link" data-nav="connections">管理模型</button></div><p class="muted">${d.health.components.find(c=>c.component==='模型连接').status==='configured'?'已配置模型连接':'尚未配置模型连接'}</p><p style="margin-top:12px">${esc(d.current_model||'使用 OpenAI-compatible 模型服务')}</p></section><section class="card"><div class="card-head"><h2>最近操作日志</h2><button class="link" data-nav="usage">查看全部</button></div>${d.trace.length?d.trace.map(t=>`<div class="status-row"><i class="dot ok"></i><span>${esc(t.name)}</span><span>${date(t.started_at)}</span></div>`).join(''):'<p class="muted">暂无操作记录</p>'}</section></div>`}
async function chat(){const [sessions,agents]=await Promise.all([get('sessions'),get('agents')]);let msgs=[],runs=[];if(state.sid){[msgs,runs]=await Promise.all([api(`/api/sessions/${encodeURIComponent(state.sid)}/messages`),get('runs')]);msgs=msgs.messages;runs=runs.runs.filter(r=>r.session_id===state.sid);state.run=runs.find(r=>r.session_id===state.sid&&['running','queued','waiting_approval'].includes(r.status))||null}const selected=runs[0];state.bound=!!selected;return `<div class="chat"><aside class="chat-left"><h2>会话</h2><input id="sessionSearch" aria-label="搜索会话" placeholder="搜索会话" style="width:100%;margin-top:15px">${btn('+ 新建会话','new-chat','','primary')}${sessions.sessions.map(s=>`<small>${s.archived?'已归档':'最近会话'} ${(s.tags||[]).map(esc).join(' · ')}</small><button data-session="${esc(s.sid)}" title="${esc(s.title||s.sid)}">${esc(s.title||'未命名会话')}</button>`).join('')||'<p class="muted" style="margin-top:20px">暂无会话</p>'}</aside><section class="chat-center"><div class="chat-top"><strong>${state.sid?'本地工作区':'开始一段新对话'}</strong>${selected?badge(selected.status):''}<span class="badge">${selected?.agent_version?'版本 '+selected.agent_version:'默认助手'}</span></div><div class="messages" id="messages">${msgs.length?msgs.filter(m=>['user','assistant'].includes(m.role)&&m.content).map(m=>`<div class="message ${m.role==='user'?'user':''}"><div class="role">${m.role==='user'?'你':'PyHarness Agent'}</div>${esc(typeof m.content==='string'?m.content:JSON.stringify(m.content))}</div>`).join(''):empty('今天想完成什么？','输入任务，选择已发布的 Agent，然后开始执行。','chat')}</div><form id="compose" class="composer"><textarea id="messageText" aria-label="输入任务" placeholder="描述你想完成的任务…" required></textarea><div class="toolbar"><select id="agentSelect" aria-label="选择 Agent" ${selected?'disabled':''}><option value="">通用助手 · 禁止执行</option>${agents.agents.filter(a=>a.current_version>0&&a.status!=='deprecated').map(a=>`<option value="${esc(a.agent_id)}" data-version="${selected?.agent_id===a.agent_id?selected.agent_ async function runs(){const d=await get('runs');return title('任务中心','查看来自任务队列的真实执行状态',`<div class="toolbar">${btn('表格 / 卡片','toggle-view')}${btn('刷新','refresh')}</div>`)+(d.runs.length?(state.view==='cards'?`<div class="list-grid">${d.runs.map(r=>`<div class="card"><h3>${esc(r.name)}</h3><p>${badge(r.status)} · ${r.token_usage} tokens</p>${runError(r)}${btn('查看','run-detail',r.run_id)}</div>`).join('')}</div>`:`<div class="card table-wrap"><table><thead><tr><th>任务 / 会话</th><th>状态</th><th>步骤</th><th>开始时间</th><th>Token</th><th>成本</th><th>操作</th></tr></thead><tbody>${d.runs.map(r=>`<tr><td>${esc(r.name)}<br><small>${esc(r.session_id)}</small></td><td>${badge(r.status)}${runError(r)}</td><td>${r.current_step}/${r.total_steps}</td><td>${date(r.started_at)}</td><td>${r.token_usage}</td><td>${r.estimated_cost??'未知'}</td><td>${btn('详情','run-detail',r.run_id)}${['queued','running','waiting_approval'].includes(r.status)?btn('取消','stop',r.run_id):['failed','cancelled'].includes(r.status)&&r.retry_count<1?btn('重试','retry',r.run_id):''}</td></tr>`).join('')}</tbody></table></div>`):`<div class="card">${empty('暂无任务','从会话页面创建真实运行','tasks')}</div>`)}

function rememberCompose(){const form=$('#compose');if(!form)return;const saved=composer(form.dataset.sid||null);saved.text=$('#messageText')?.value||'';saved.agent=$('#agentSelect')?.value||''}
function restoreCompose(){const form=$('#compose');if(!form)return;form.dataset.sid=state.sid||'';const saved=composer();$('#messageText').value=saved.text;$('#agentSelect').value=saved.agent;const label=$('#attachmentCount');if(label)label.textContent=`附件 ${saved.attachments.length}`}
async function render(quiet=false){rememberCompose();const page=(location.hash.slice(1)||'dashboard').split('?')[0];state.page=renderers[page]?page:'dashboard';const gen=++state.generation;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));if(!quiet)main.innerHTML='<div class="skeleton"></div><div class="skeleton" style="height:400px"></div>';try{const html=await renderers[state.page]();if(gen!==state.generation)return;rememberCompose();main.innerHTML=html;restoreCompose();wireForms();if(state.page==='chat'&&state.sid)connectStream(state.sid);else disconnectStream()}catch(e){if(gen!==state.generation)return;main.innerHTML=`<div class="error"><strong>加载失败</strong><p style="margin-top:10px">${esc(e.message)}</p>${btn('重试','refresh')}</div>`;console.error(e)}}
function disconnectStream(){if(state.stream){state.stream.close();state.stream=null}clearTimeout(state.refreshTimer)}
function connectStream(sid){if(state.stream?.sid===sid)return;disconnectStream();const stream=new EventSource(`/api/stream?sid=${encodeURIComponent(sid)}`);stream.sid=sid;state.stream=stream;const refresh=()=>{if(state.sid!==sid)return;clearTimeout(state.refreshTimer);state.refreshTimer=setTimeout(async()=>{if(state.page==='chat'&&!$('#messageText')?.value)await render(true)},500)};['system.error','llm.error','task.started','task.completed','task.failed','agent.message','tool.result','tool.error','approval.requested','approval.granted','approval.denied'].forEach(k=>stream.addEventListener(k,refresh));stream.onopen=refresh;stream.onerror=()=>{if(state.sid===sid)toast('连接中断，正在恢复；重连后重新读取持久化消息')};stream.addEventListener('llm.chunk',event=>{try{const e=JSON.parse(event.data),delta=e.payload?.delta||e.delta||'';let draft=$('#streamDraft');if(!draft){draft=document.createElement('div');draft.id='streamDraft';draft.className='message';$('#messages')?.append(draft)}draft.textContent+=delta}catch(e){console.error('SSE 数据错误',e)}})}
async function newSession(agent=''){rememberCompose();const s=await post('sessions');state.sid=s.sid;state.run=null;composer().agent=agent;location.hash='chat';await render()}
function filePicker(accept,callback){const input=document.createElement('input');input.type='file';input.accept=accept;input.onchange=async()=>{try{if(input.files[0])await callback(input.files[0])}catch(e){toast(e.message)}};input.click()}
async function agentEditor(data,id=''){modal('Agent 草稿配置',`<p class="muted" style="margin-bottom:12px">配置将在保存时校验；发布会生成不可变版本。host_approved 无 OS 级隔离。</p><form id="agentForm"><textarea id="agentJson" aria-label="Agent 配置 JSON">${esc(JSON.stringify(data,null,2))}</textarea><div class="toolbar" style="margin-top:12px"><button class="primary">保存草稿</button></div></form>`);$('#agentForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/v1/agents'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:JSON.stringify(JSON.parse($('#agentJson').value))});$('#dialog').close();toast('草稿已保存');go('agents')}catch(err){toast(err.message)}}}
const actions={
'refresh':()=>render(),'new-chat':newSession,'usage':()=>go('usage'),'approvals':()=>go('approvals'),'artifacts':()=>go('artifacts'),'inspect-steps':()=>state.run?actions['run-detail'](state.run.run_id):toast('暂无当前运行'),'theme':()=>{document.body.classList.toggle('dark');localStorage.setItem('ph-theme',document.body.classList.contains('dark')?'dark':'light')},
'toggle-view':()=>{state.view=state.view==='table'?'cards':'table';render()},
'run-detail':async id=>showJSON('运行详情与 Trace',await get('runs/'+encodeURIComponent(id))),
'stop':async id=>{if(confirm('取消这个运行？已发生的副作用不会自动撤销。')){await post('runs/'+encodeURIComponent(id)+'/cancel');toast('已请求取消');render()}},
'retry':async id=>{await post('runs/'+encodeURIComponent(id)+'/retry');toast('已提交一次重试');render()},
'approve':async id=>{if(confirm('确认批准这一次操作？请先核对命令、文件和风险。')){await post('approvals/'+encodeURIComponent(id)+'/approve');toast('审批已提交，队列状态已同步');render()}},
'reject':async id=>{await post('approvals/'+encodeURIComponent(id)+'/reject');toast('已拒绝');render()},
'agent-new':async()=>agentEditor((await get('agents')).templates[0]),'agent-template':async id=>agentEditor((await get('agents')).templates[Number(id)]),
'agent-edit':async id=>agentEditor((await get('agents')).agents.find(a=>a.agent_id===id),id),
'agent-versions':async id=>{const d=await get('agents/'+id+'/versions');modal('不可变版本',d.versions.map(v=>`<section class="card"><h3>v${v.version} · ${date(v.created_at)}</h3><p>SHA256 ${esc(v.sha256)}</p><details><summary>完整策略与权限预览</summary><pre>${esc(JSON.stringify(v.snapshot,null,2))}</pre></details>${btn('复制此版本','version-copy',id+'~'+v.version)}${btn('废弃此版本','version-deprecate',id+'~'+v.version)}${v.version>1?btn('与上一版本比较','version-diff',id+'~'+v.version):''}</section>`).join('')||empty('尚未发布版本'))},
'agent-publish':async id=>{await post('agents/'+id+'/publish');toast('新版本已发布');render()},
'agent-copy':async id=>{await post('agents/'+id+'/copy');toast('已复制为草稿');render()},
'agent-deprecate':async id=>{if(confirm('废弃 Agent？历史版本和运行将保留。')){await post('agents/'+id+'/deprecate');render()}},
'agent-delete':async id=>{if(confirm('删除未发布草稿？')){await api('/api/v1/agents/'+id,{method:'DELETE'});render()}},
'knowledge-upload':()=>filePicker('.txt,.md,.json,.csv',async f=>{if(f.size>1048576)throw Error('文档上限 1 MB');await post('knowledge',{name:f.name,text:await f.text()});toast('文档已索引');go('knowledge')}),
'knowledge-delete':async id=>{if(confirm('删除此知识文档？')){await api('/api/v1/knowledge/'+id,{method:'DELETE'});render()}},
 'artifact-upload':()=>filePicker('',async f=>{if(f.size>10*1024*1024)throw Error('文件上限 10 MB');let uploadSid=state.sid;if(!uploadSid){uploadSid=(await post('sessions')).sid;if(!state.sid)state.sid=uploadSid}const owner=composer(uploadSid),bytes=new Uint8Array(await f.arrayBuffer());let text='';for(let i=0;i<bytes.length;i+=8192)text+=String.fromCharCode(...bytes.subarray(i,i+8192));const uploaded=await post('artifacts',{session_id:uploadSid,filename:f.name,data_base64:btoa(text)});owner.attachments.push(uploaded.artifact_id);toast('文件已上传到所属会话，将附加到下一条消息');if(state.sid===uploadSid){if($('#attachmentCount'))$('#attachmentCount').textContent='附件 '+owner.attachments.length;if(state.page!=='chat')go('artifacts')}}),
'artifact-preview':async id=>{const d=await get('artifacts/'+id+'/preview');modal(d.record.filename,`<p class="muted">SHA256 ${esc(d.record.sha256)}</p>${d.image?`<img src="${esc(d.image)}" alt="产物图片预览" style="max-width:100%;max-height:65vh">`:d.record.filename.endsWith('.md')?`<article>${markdownPreview(d.text)}</article>`:`<pre>${esc(d.text)}</pre>`}${d.truncated?'<p>预览已截断</p>':''}`)},
'artifact-apply':async id=>{if(confirm('请求应用此 Patch？请先查看 Diff。随后仍需在审批中心批准。')){await post('artifacts/'+id+'/apply');toast('已请求受治理应用，请到审批中心处理');go('approvals')}},
'artifact-export':async id=>{await post('artifacts/'+id+'/export');toast('已请求导出批准');go('approvals')},
'artifact-delete':async id=>{if(confirm('删除文件及其可下载内容？')){await api('/api/v1/artifacts/'+id,{method:'DELETE'});render()}},
'sandbox-destroy':async id=>{if(confirm('销毁沙盒及其中的进程和临时文件？')){await post('sandboxes/'+id+'/destroy');render()}},
'model-new':()=>{modal('添加模型连接',`<form id="modelForm">${[['label','名称','text'],['model','模型名','text'],['base_url','API endpoint','url'],['api_key','API Key（只写）','password']].map(([id,label,type])=>`<label class="field">${label}<input id="model_${id}" type="${type}" required autocomplete="off"></label>`).join('')}<button class="primary">保存</button></form>`);$('#modelForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/settings/models',{method:'POST',body:JSON.stringify(Object.fromEntries(['label','model','base_url','api_key'].map(k=>[k,$('#model_'+k).value])))});$('#dialog').close();toast('模型已保存');render()}catch(err){toast(err.message)}}},
'model-activate':async id=>{await api('/api/settings/models/'+encodeURIComponent(id)+'/activate',{method:'POST',body:'{}'});toast('已启用；新会话采用此配置');render()},
'model-delete':async id=>{if(confirm('删除此模型连接？')){await api('/api/settings/models/'+encodeURIComponent(id),{method:'DELETE'});render()}},
'schedule-new':async()=>{const d=await get('agents');modal('创建计划任务',`<form id="scheduleForm"><label class="field">名称（小写字母开头，可含数字、下划线和点）<input id="scheduleName" pattern="[a-z][a-z0-9_.]{1,63}" required></label><label class="field">Agent 发布版本<select id="scheduleAgent"><option value="">默认助手 · 禁止执行</option>${d.agents.filter(a=>a.current_version&&a.status!=='deprecated').map(a=>`<option value="${a.agent_id}~${a.current_version}">${esc(a.name)} v${a.current_version}</option>`).join('')}</select></label><label class="field">间隔（秒）<input id="scheduleExpr" type="number" value="3600" min="60" required></label><label class="field">执行意图<textarea id="scheduleIntent" style="min-height:100px" required></textarea></label><p class="warning">计划会新建专用会话，固定 Agent 版本；高风险操作仍需要人工审批。程序关闭时不会运行。</p><button class="primary">创建</button></form>`);$('#scheduleForm').onsubmit=async e=>{e.preventDefault();try{const [agent_id,version]=$('#scheduleAgent').value.split('~');await post('schedules',{action:'add',agent_id:agent_id||null,agent_version:Number(version)||null,name:$('#scheduleName').value,kind:'interval',expr:$('#scheduleExpr').value,intent:$('#scheduleIntent').value});$('#dialog').close();go('schedules')}catch(err){toast(err.message)}}}

};
actions['agent-test']=async id=>{await newSession(id)};
actions['version-copy']=async id=>{const [agent,version]=id.split('~');await post('agents/'+agent+'/copy',{version:Number(version)});$('#dialog').close();render()};
actions['version-deprecate']=async id=>{const [agent,version]=id.split('~');await post('agents/'+agent+'/deprecate-version',{version:Number(version)});toast('此版本已禁止新会话使用；历史运行保留')};
actions['version-diff']=async id=>{const [agent,version]=id.split('~');const d=await post('agents/'+agent+'/diff',{from:Number(version)-1,to:Number(version)});modal('版本差异',`<pre>${esc(d.diff||'无差异')}</pre>`)};
actions['attachments-clear']=()=>{rememberCompose();composer().attachments=[];restoreCompose()};
actions['session-archive']=async id=>{const s=(await get('sessions')).sessions.find(s=>s.sid===id);await post('sessions/'+id+'/metadata',{archived:!s.archived});render()};
actions['session-tags']=async id=>{const title=prompt('会话标题');if(title===null)return;const tags=prompt('标签，用逗号分隔')||'';await post('sessions/'+id+'/metadata',{title,tags:tags.split(',').map(t=>t.trim()).filter(Boolean)});render()};
actions['knowledge-retry']=async id=>{await post('knowledge/'+id+'/retry');toast('索引已重新验证');render()};
actions['knowledge-replace']=id=>filePicker('.txt,.md,.json,.csv',async f=>{if(f.size>1048576)throw Error('文档上限 1 MB');await post('knowledge/'+id+'/replace',{text:await f.text()});render()});
actions['knowledge-provider']=async()=>{const d=await get('connections');const choices=['exact_keyword',...d.connections.filter(c=>c.type==='remote_rag').map(c=>c.connection_id)];const provider=prompt('选择 Provider：'+choices.join('，'),'exact_keyword');if(provider){await post('knowledge/settings/provider',{provider});render()}};
actions['usage-filter']=()=>{const text=prompt('筛选 JSON：支持 from / to（带时区 ISO）、session_id、agent_id、run_id、model、tool',JSON.stringify(state.usageFilter||{}));if(text!==null){state.usageFilter=JSON.parse(text);render()}};
actions['skills-reload']=async()=>{await api('/api/skills/reload',{method:'POST',body:'{}'});render()};
actions['connection-new']=()=>{modal('添加受信任连接',`<p class="warning">MCP 命令会在宿主执行，不接受命令行密钥。RAG 仅访问明确配置的 endpoint，文档会发送给该服务。</p><form id="connectionForm"><textarea id="connectionJson" aria-label="连接 JSON">${esc(JSON.stringify({type:'mcp',config:{name:'example',command:['python','server.py'],enabled:false}},null,2))}</textarea><p>远程 RAG：{"type":"remote_rag","name":"rag","endpoint":"https://rag.example.test"}</p><button class="primary">保存</button></form>`);$('#connectionForm').onsubmit=async e=>{e.preventDefault();try{await post('connections',JSON.parse($('#connectionJson').value));$('#dialog').close();render()}catch(err){toast(err.message)}}};
for(const action of ['test','start','stop','enable','disable','delete'])actions['connection-'+action]=async id=>{if(['start','test','delete'].includes(action)&&!confirm('确认对这个受信任连接执行 '+action+'？MCP 测试和启动会运行宿主命令。'))return;const r=await post('connections/'+encodeURIComponent(id)+'/'+action);toast(r.status||'已更新');render()};
actions['model-test']=async id=>{const d=await post('connections/model:'+id+'/test');showJSON('模型连接测试',d)};
actions['model-rotate']=async id=>{const profiles=(await get('connections')).models.profiles;const row=profiles.find(p=>p.id===id);modal('替换密钥',`<form id="rotate"><label class="field">新 API Key<input id="replacementKey" type="password" autocomplete="off" required></label><button class="primary">替换</button></form>`);$('#rotate').onsubmit=async e=>{e.preventDefault();try{await api('/api/settings/models',{method:'POST',body:JSON.stringify({id,label:row.label,base_url:row.base_url,model:row.model,api_key:$('#replacementKey').value})});$('#dialog').close();toast('密钥已替换；请创建新会话')}catch(err){toast(err.message)}}};
for(const action of ['pause','resume','remove','run_now'])actions['schedule-'+action]=async id=>{const [session_id,name]=id.split('~');if(action==='remove'&&!confirm('删除计划任务？执行历史将保留。'))return;await post('schedules',{session_id,name,action});toast('计划任务已更新');render()};
actions['schedule-edit']=async id=>{const [session_id,name]=id.split('~');const row=(await get('schedules')).schedules.find(j=>j.session_id===session_id&&j.name===name);modal('编辑计划任务',`<form id="editSchedule"><label class="field">间隔 / cron 表达式<input id="editExpr" value="${esc(row.expr)}" required></label><label class="field">执行意图<textarea id="editIntent" style="min-height:140px" required>${esc(row.intent)}</textarea></label><button class="primary">保存</button></form>`);$('#editSchedule').onsubmit=async e=>{e.preventDefault();try{await post('schedules',{session_id,name,action:'edit',kind:row.kind,expr:$('#editExpr').value,intent:$('#editIntent').value});$('#dialog').close();render()}catch(error){toast(error.message)}}};
function wireForms(){const compose=$('#compose');if(compose)compose.onsubmit=async e=>{e.preventDefault();rememberCompose();const requestSid=state.sid,owner=composer(requestSid),text=owner.text.trim();if(!text)return;const select=$('#agentSelect'),option=select.selectedOptions[0],body={text,session_id:requestSid,artifact_ids:[...owner.attachments]};if(select.value&&!state.bound){body.agent_id=select.value;body.agent_version=Number(option.dataset.version)}const button=compose.querySelector('button[type=submit]');button.disabled=true;try{const result=await post('runs',body);rememberCompose();if(owner.text.trim()===text)owner.text='';owner.attachments=owner.attachments.filter(id=>!body.artifact_ids.includes(id));if(!requestSid)state.composers[result.session_id]=owner;if(state.sid===requestSid){state.sid=result.session_id;if($('#compose')===compose)$('#messageText').value=owner.text;await render()}else toast('任务已在原会话提交')}catch(err){toast(err.message)}finally{button.disabled=false}};const q=$('#knowledgeQuery');if(q)q.onsubmit=async e=>{e.preventDefault();try{showJSON('检索证据',await post('knowledge/query',{query:$('#queryText').value}))}catch(err){toast(err.message)}};const s=$('#sessionSearch');if(s)s.oninput=()=>document.querySelectorAll('.chat-left [data-session]').forEach(b=>b.hidden=!b.textContent.includes(s.value));$('#messages')?.scrollTo(0,$('#messages').scrollHeight)}
document.addEventListener('click',async e=>{const target=e.target.closest('[data-nav],[data-action],[data-session],[data-filter]');if(!target)return;e.preventDefault();try{if(target.dataset.session){rememberCompose();state.sid=target.dataset.session;disconnectStream();go('chat')}else if(target.dataset.nav)go(target.dataset.nav);else if(target.dataset.filter){state.approvalTab=target.dataset.filter;render()}else if(actions[target.dataset.action])await actions[target.dataset.action](target.dataset.id)}catch(err){toast(err.message);console.error(err)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}});
$('#globalSearch').onkeydown=async e=>{if(e.key==='Enter'){const q=e.target.value.trim();const found=pages.find(p=>p[1].includes(q));if(found)go(found[0]);else{const d=await get('sessions');const rows=d.sessions.filter(s=>(s.title||s.sid).includes(q));modal('搜索会话',sessionRows(rows))}}};
$('#theme').onclick=actions.theme;if(localStorage.getItem('ph-theme')==='dark')document.body.classList.add('dark');window.addEventListener('hashchange',()=>render());window.addEventListener('beforeunload',disconnectStream);render();
</script></body></html>
