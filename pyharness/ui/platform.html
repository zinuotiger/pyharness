function go(page){location.hash=page;if(state.page===page)render()}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4000)}
async function api(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),path.endsWith('/test')?70000:30000);try{let r;try{r=await fetch(path,{credentials:'same-origin',...options,signal:options.signal||controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}})}catch(cause){const e=Error(cause.name==='AbortError'?'请求超时':'无法连接本地服务');e.code=cause.name==='AbortError'?'request_timeout':'network_unavailable';throw e}if(r.status===204)return null;let data;try{data=await r.json()}catch{const e=Error(`HTTP ${r.status}：响应不是 JSON`);e.code='invalid_response';e.status=r.status;throw e}if(!r.ok){const accountMessages={account_role_required:'当前账户没有执行此操作的权限。模型连接由团队管理员管理，请联系管理员。',account_read_only:'当前账户为只读角色，没有修改权限。请联系团队管理员。',account_tenant_mismatch:'当前账户无权访问其他团队的数据，请检查登录的团队。',account_operator_api:'此操作仅向本地操作者开放，团队账户没有访问权限。',account_operator_connection:'此连接仅由本地操作者管理，团队账户没有修改权限。'};const e=Error(`${data.code||r.status}：${accountMessages[data.code]||(r.status===403?'当前账户没有执行此操作的权限。请联系团队管理员。':data.message||data.advice||data.detail||'请求失败')}`);e.code=data.code;e.status=r.status;throw e}return data}finally{clearTimeout(timer)}}
function feedbackFor(error){const code=error.code||'',status=error.status;let text=error.message||'提交失败',action='';if(['model_not_configured','model_connection_missing','model_credential_missing','tenant_model_profile_required'].includes(code)){text=code==='model_connection_missing'?'该 Agent 绑定的模型连接已不存在。请在设置中检查连接，并创建使用有效配置的 Agent 版本和新会话。':'当前没有可用的模型配置。请在设置 → 模型配置中添加并启用连接，再发送任务。';action='models'}else if(status===401){text='身份已失效或模型凭据不可用。请先重新登录；若已登录，请检查模型连接。草稿已保留。';action='login'}else if(status===403){text='当前账户没有发送或访问这个会话的权限。请联系团队管理员检查角色。'}else if(['request_timeout','network_unavailable','invalid_response'].includes(code)){text='提交结果尚未确认：'+text+'。草稿已保留；请先检查任务中心，确认是否已有 Run，再决定是否重发。';action='runs'}else if(status===429){text='当前请求或团队配额达到限制，请稍后检查用量与活动任务。';action='runs'}return {text,action,error:true}}
function feedbackHTML(f){if(!f)return '';return `<div class="${f.error?'failure':'warning'}" role="${f.error?'alert':'status'}">${esc(f.text)} ${f.action==='models'?'<button data-nav="connections">打开模型配置</button>':f.action==='login'?'<a href="/login">重新登录</a>':f.action==='runs'?'<button data-nav="runs">查看任务中心</button>':''}</div>`}
function showSendFeedback(owner,feedback){owner.feedback=feedback;if(owner===composer()&&$('#sendFeedback'))$('#sendFeedback').innerHTML=feedbackHTML(feedback)}
async function refreshModelHint(){const element=$('#modelReadiness');if(!element)return;const select=$('#agentSelect'),option=select?.selectedOptions[0],params=new URLSearchParams();if(state.sid)params.set('session_id',state.sid);if(select?.value){params.set('agent_id',select.value);params.set('agent_version',option.dataset.version)}const request=++state.readinessGeneration;try{const d=await get('chat/readiness?'+params);if(request!==state.readinessGeneration||element!==$('#modelReadiness'))return;element.innerHTML=d.ready?`<small>当前模型：${esc(d.model)} · 配置已选择，连通性未由此检查</small>`:feedbackHTML(feedbackFor({code:d.code}));}catch(e){if(request===state.readinessGeneration&&element===$('#modelReadiness'))element.innerHTML=feedbackHTML(feedbackFor(e))}}
function runNotice(run){if(!run)return '';return `<div class="run-notice" data-run-id="${esc(run.run_id)}">${badge(run.status)} <small>Run ${esc(run.run_id)}</small> ${btn('查看此运行','run-detail',run.run_id)}${runError(run)}${run.status==='failed'?'<p>任务未完成。请查看运行详情；模型或凭据问题请到设置 → 模型配置检查。未自动重发任务。</p>':''}${run.status==='waiting_approval'?btn('处理待审批操作','approvals'):''}</div>`}

const get=p=>api('/api/v1/'+p),post=(p,b={})=>api('/api/v1/'+p,{method:'POST',body:JSON.stringify(b)});
function modal(name,html){$('#dialogTitle').textContent=name;$('#dialogBody').innerHTML=html;$('#dialog').showModal()}
function markdownPreview(text){return esc(text).split(/\r?\n/).map(line=>{const h=line.match(/^(#{1,6}) (.*)$/);if(h)return `<h${h[1].length}>${h[2]}</h${h[1].length}>`;if(line.startsWith('- '))return `<p>• ${line.slice(2)}</p>`;return `<p style="white-space:pre-wrap">${line||'&nbsp;'}</p>`}).join('')}
function showJSON(name,data){modal(name,`<pre>${esc(JSON.stringify(data,null,2))}</pre>`)}
$('#dialogClose').onclick=()=>$('#dialog').close();
function sessionRows(rows){return rows.length?rows.map(s=>`<div class="row"><span class="bubble purple">${icon('chat')}</span><div class="grow"><a href="#chat" data-session="${esc(s.sid)}"><strong>${esc(s.title||'未命名会话')}</strong></a><p>${esc(s.sid)}</p></div><small>${date(s.updated)}</small></div>`).join(''):empty('还没有会话','新建对话，开始你的第一个 Agent 任务','chat')}
function runError(r){return r?.error_code?`<p class="failure" data-run-error>${esc(({model:'模型错误',tool:'工具错误',approval:'审批拒绝',cancellation:'用户取消',sandbox:'Sandbox 错误',execution:'执行错误'})[r.error_kind]||'执行错误')} · ${esc(r.error_code)}<br>${esc(r.error_message||'')}</p>`:''}
function runRows(rows){return rows.length?rows.map(r=>`<div class="row"><span class="bubble ${r.status==='completed'?'green':''}">${icon('play')}</span><div class="grow"><strong><a href="#runs" data-action="run-detail" data-id="${esc(r.run_id)}">${esc(r.name)}</a></strong><p>${r.current_step} / ${r.total_steps} 个执行步骤</p>${runError(r)}</div>${badge(r.status)}</div>`).join(''):empty('暂无运行任务','任务会在模型开始执行后出现在这里','tasks')}
function healthRows(rows){return rows.map(r=>`<div class="status-row"><i class="dot ${r.status==='available'?'ok':''}"></i><span>${esc(r.component)}</span><span>${badge(r.status)}</span></div>`).join('')}
async function dashboard(){const d=await get('dashboard');return `<div class="greeting"><div><h1>你好，${esc(d.operator==='default'?'本地操作者':d.operator)} <span style="font-size:26px">👋</span></h1><p>让 AI 帮你更高效地完成复杂任务</p></div>${[['play','运行中任务',d.running,''],['clock','待审批',d.pending_approvals,'amber'],['chart','本月用量',d.month_usage.tokens+'',''],['box','隔离沙盒',labels[d.health.docker.status]||d.health.docker.status,'green']].map(([i,l,v,c])=>`<div class="stat"><span class="bubble ${c}">${icon(i)}</span><div><small>${l}</small><b style="${i==='box'?'font-size:21px':''}">${esc(v)}</b></div></div>`).join('')}</div><div class="actions">${[['chat','新建对话','与 Agent 开始对话','new-chat'],['file','上传文档','构建知识库','knowledge-upload'],['calendar','创建计划任务','定时执行任务','schedule-new'],['chart','查看用量','模型与工具使用统计','usage']].map(([i,t,s,a],n)=>`<button class="action ${n===0?'primary':''}" data-action="${a}"><span class="bubble">${icon(i)}</span><span><strong>${t}</strong><small>${s}</small></span><span class="arrow">›</span></button>`).join('')}</div><div class="dashboard-grid"><section class="card recent"><div class="card-head"><h2>最近会话</h2><button class="link" data-nav="chat">查看全部</button></div>${sessionRows(d.sessions)}</section><section class="card task-card"><div class="card-head"><h2>任务状态</h2><button class="link" data-nav="runs">查看全部</button></div>${runRows(d.runs)}</section><div class="side-stack"><section class="card"><div class="card-head"><h2>快捷操作</h2></div><div class="quick"><button data-action="new-chat">${icon('chat')}新建会话</button><button data-nav="sandboxes">${icon('box')}查看沙盒环境</button><button data-action="artifact-upload">${icon('upload')}上传文件</button><button data-nav="connections">${icon('tools')}管理连接</button></div></section><section class="card"><div class="card-head"><h2>系统状态</h2></div>${healthRows(d.health.components.slice(0,5))}</section></div></div><div class="bottom-grid"><section class="card"><div class="card-head"><h2>${icon('database')} 知识库</h2><button class="link" data-action="knowledge-upload">上传文档</button></div><div class="metrics"><div><b>${d.knowledge.count}</b><small>文档数</small></div><div><b>${(d.knowledge.bytes/1024).toFixed(1)} KB</b><small>存储量</small></div><div><b>关键词</b><small>默认 Provider</small></div></div></section><section class="card"><div class="card-head"><h2>模型配置</h2><button class="link" data-nav="connections">管理模型</button></div><p class="muted">${d.health.components.find(c=>c.component==='模型连接').status==='configured'?'已配置模型连接':'尚未配置模型连接'}</p><p style="margin-top:12px">${esc(d.current_model||'使用 OpenAI-compatible 模型服务')}</p></section><section class="card"><div class="card-head"><h2>最近操作日志</h2><button class="link" data-nav="usage">查看全部</button></div>${d.trace.length?d.trace.map(t=>`<div class="status-row"><i class="dot ok"></i><span>${esc(t.name)}</span><span>${date(t.started_at)}</span></div>`).join(''):'<p class="muted">暂无操作记录</p>'}</section></div>`}
async function chat(){const agents=await get('agents');let msgs=[],runs=[];if(state.sid){[msgs,runs]=await Promise.all([api(`/api/sessions/${encodeURIComponent(state.sid)}/messages`),get('runs')]);msgs=msgs.messages;runs=runs.runs.filter(r=>r.session_id===state.sid);state.run=runs.find(r=>r.session_id===state.sid&&['running','queued','waiting_approval'].includes(r.status))||null}const selected=runs[0];state.bound=!!selected;return `<div class="chat ${state.inspectorOpen?'inspector-open':''}"><section class="chat-center"><div class="chat-top"><strong>${state.sid?'本地工作区':'开始一段新对话'}</strong>${selected?badge(selected.status):''}<span class="badge">${selected?.agent_version?'版本 '+selected.agent_version:'默认助手'}</span><button id="inspectorToggle" data-action="toggle-inspector" aria-controls="runInspector" aria-expanded="${state.inspectorOpen}" style="margin-left:auto">${state.inspectorOpen?'收起运行详情':'查看运行详情'}</button>${state.sid?btn('目标 / 待办 / 计划','session-activity',state.sid)+btn('后台任务','session-jobs',state.sid):''}${selected?.status==='waiting_approval'?btn('有待审批操作','approvals'):''}</div>${runNotice(selected)}<div class="messages" id="messages">${msgs.length?msgs.filter(m=>['user','assistant'].includes(m.role)&&m.content).map(m=>`<div class="message ${m.role==='user'?'user':''}"><div class="role">${m.role==='user'?'你':'PyHarness Agent'}</div>${esc(typeof m.content==='string'?m.content:JSON.stringify(m.content))}${attachmentCards(m.attachments||[])}${messageActions(m)}</div>`).join(''):empty('今天想完成什么？','输入任务，选择已发布的 Agent，然后开始执行。','chat')}</div><form id="compose" class="composer"><div id="modelReadiness" role="status"></div><div id="sendFeedback"></div><div id="attachmentList" aria-live="polite"></div><textarea id="messageText" aria-label="输入任务" placeholder="描述你想完成的任务…" required></textarea><div class="toolbar"><select id="agentSelect" aria-label="选择 Agent" ${selected?'disabled':''}><option value="">通用助手 · 禁止执行</option>${agents.agents.filter(a=>a.current_version>0&&a.status!=='deprecated').map(a=>`<option value="${esc(a.agent_id)}" data-version="${selected?.agent_id===a.agent_id?selected.agent_version:a.current_version}">${esc(a.name)} · v${selected?.agent_id===a.agent_id?selected.agent_version:a.current_version}</option>`).join('')}</select>${btn('附件','artifact-upload')}<span id="attachmentCount"></span>${btn('清除附件','attachments-clear')}<label><input type="checkbox" id="useVision">发送图片给视觉模型</label><small>权限、知识库和预算由发布版本约束</small><span style="flex:1"></span>${state.run?btn('停止','stop',state.run.run_id,'danger'):''}<button class="primary" type="submit">发送 ↑</button></div></form></section><aside id="runInspector" class="inspector" ${state.inspectorOpen?'':'hidden'}><h2>运行检查器</h2><div class="tabs" style="margin-top:18px">${btn('步骤','inspect-steps')}${btn('审批','approvals')}</div>${selected?`${badge(selected.status)}${runError(selected)}<p class="muted">${esc(selected.run_id)}</p><div class="row">执行步骤 ${selected.current_step} / ${selected.total_steps}</div><div class="row">已知 Token ${selected.token_usage}${selected.usage_status==='unknown'?' · 部分用量未知':''}</div><div class="row">成本 ${selected.estimated_cost??'未知'}</div>${btn('查看结构化 Trace','run-detail',selected.run_id)}`:empty('暂无运行','提交任务后查看执行步骤','trace')}${btn('待答问题','questions')}${state.sid?btn('子任务','subtasks',state.sid):''}${btn('查看产物','artifacts')}${btn('查看审批','approvals')}${state.sid?btn('标签 / 标题','session-tags',state.sid)+btn('归档 / 恢复','session-archive',state.sid):''}</aside></div>`}
async function runs(){const d=await get('runs');return title('任务中心','查看来自任务队列的真实执行状态',`<div class="toolbar">${btn('表格 / 卡片','toggle-view')}${btn('刷新','refresh')}</div>`)+(d.runs.length?(state.view==='cards'?`<div class="list-grid">${d.runs.map(r=>`<div class="card"><h3>${esc(r.name)}</h3><p>${badge(r.status)} · ${r.token_usage} tokens</p>${runError(r)}${btn('查看','run-detail',r.run_id)}</div>`).join('')}</div>`:`<div class="card table-wrap"><table><thead><tr><th>任务 / 会话</th><th>状态</th><th>步骤</th><th>开始时间</th><th>Token</th><th>成本</th><th>操作</th></tr></thead><tbody>${d.runs.map(r=>`<tr><td>${esc(r.name)}<br><small>${esc(r.session_id)}</small></td><td>${badge(r.status)}${runError(r)}</td><td>${r.current_step}/${r.total_steps}</td><td>${date(r.started_at)}</td><td>${r.token_usage}</td><td>${r.estimated_cost??'未知'}</td><td>${btn('详情','run-detail',r.run_id)}${['queued','running','waiting_approval'].includes(r.status)?btn('取消','stop',r.run_id):['failed','cancelled'].includes(r.status)&&r.retry_count<1?btn('重试','retry',r.run_id):''}</td></tr>`).join('')}</tbody></table></div>`):`<div class="card">${empty('暂无任务','从会话页面创建真实运行','tasks')}</div>`)}
async function approvals(){const d=await get('approvals'),rows=d.approvals.filter(a=>a.status===state.approvalTab);return title('审批中心','批准后，后端会完成持久化并同步恢复队列')+`<div class="tabs">${['pending','approved','rejected','expired'].map(s=>`<button data-filter="${s}" class="${state.approvalTab===s?'active':''}">${labels[s]}</button>`).join('')}</div><div class="list-grid">${rows.map(a=>`<article class="card"><div class="card-head"><h2>${esc(a.tool)}</h2>${badge(a.status)}</div><p>${esc(a.args_summary)}</p><p>风险：${esc(a.risk||'high')} · 有效期 ${a.ttl_ms/1000} 秒</p><small>${date(a.created_at)} · ${esc(a.session_id)}</small><div class="toolbar" style="margin-top:16px">${a.status==='pending'?btn('批准一次','approve',a.id,'primary')+btn('拒绝','reject',a.id,'danger'):''}</div></article>`).join('')}</div>${rows.length?'':`<div class="card">${empty('没有'+labels[state.approvalTab]+'的操作','需要人工决策的工具调用会显示在这里','approval')}</div>`}`}

async function usage(){const [u,h,r]=await Promise.all([get('usage'+(state.usageFilter?'?'+new URLSearchParams(state.usageFilter):'')),get('system/health'),get('runs')]);return title('用量与监控','所有统计来自持久化事件；未计价数据保持未知',btn('筛选统计','usage-filter'))+`<div class="list-grid">${Object.entries({'输入 Token':u.input_tokens,'输出 Token':u.output_tokens,'缓存命中 Token':u.cache_hit,'模型请求':u.model_requests,'返回用量':u.usage_records,'用量未知请求':u.usage_unknown_requests,'工具调用':u.tool_calls,'运行数量':u.run_count,'成功率':u.success_rate===null?'暂无数据':(u.success_rate*100).toFixed(1)+'%','估算费用':u.estimated_cost??'未知','平均延迟 ms':u.average_latency_ms?.toFixed(1)??'未知','p95 延迟 ms':u.p95_latency_ms?.toFixed(1)??'未知','Sandbox 分钟':u.sandbox_minutes.toFixed(2),'产物存储 B':u.artifact_bytes,'错误率':u.error_rate===null?'暂无数据':(u.error_rate*100).toFixed(1)+'%','重试率':u.retry_rate===null?'暂无数据':(u.retry_rate*100).toFixed(1)+'%'}).map(([k,v])=>`<div class="stat"><span class="bubble">${icon('chart')}</span><div><small>${k}</small><b>${v}</b></div></div>`).join('')}</div><div class="bottom-grid"><section class="card"><h2>系统 Health</h2>${healthRows(h.components)}</section><section class="card" style="grid-column:span 2"><div class="card-head"><h2>结构化 Trace</h2></div>${runRows(r.runs.slice(0,8))}</section></div>`}
async function settings(){return title('设置','管理模型与运行策略；返回聊天保留当前会话和草稿',`<button data-nav="chat">返回聊天</button>`)+`<div class="card settings-links">${btn('账户与团队','account')}${btn('团队记忆','memory')}${btn('工作流','workflows')}${[['dashboard','工作台'],['runs','任务中心'],['approvals','审批中心'],['artifacts','文件与产物'],['usage','用量与监控'],['connections','模型配置'],['schedules','定时任务'],['agents','Agent 管理'],['knowledge','知识库管理'],['sandboxes','沙盒状态']].map(([id,label])=>`<button data-nav="${id}">${label}</button>`).join('')}<a href="/classic" target="_blank" rel="noopener">系统配置 / Skill / Plugin</a></div>`+`<div class="card"><h2>外观</h2><p class="muted" style="margin:12px 0">偏好保存在当前浏览器</p><div class="phtheme-controls"><label>主题 <select data-appearance-field="themeId"><option value="light">原主题 · 浅色</option><option value="dark">原主题 · 深色</option><option value="tech-blue-particle">科技蓝 · 粒子</option></select></label><label>动效 <select data-appearance-field="animationMode"><option value="normal">开启</option><option value="low">低动效（静态）</option><option value="off">关闭</option></select></label><button type="button" data-appearance-reset>恢复原主题</button></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h2>运行策略</h2><p style="margin:12px 0;line-height:1.8">Agent 的模型、预算、工具权限、沙盒模式与最大轮数由不可变发布版本指定。<br>默认禁止执行；isolated 不可用时 fail closed。HostApproved 不具备 OS 级隔离。<br>团队账户使用服务端角色与资源隔离；本地操作者保留独立管理权限。私有推理不会作为 Trace 展示。</p><a href="/classic" target="_blank" rel="noopener">打开原有运行时管理界面</a></div>`}
const renderers={dashboard,chat,runs,approvals,agents,knowledge,artifacts,sandboxes,connections,schedules,usage,settings};
let draftNamespace=null;
function saveDrafts(){if(!draftNamespace)return;try{const drafts={};for(const [sid,v] of Object.entries(state.composers||{}))drafts[sid]={text:v.text||'',agent:v.agent||'',attachments:v.attachments||[],files:v.files||{},vision:v.vision===true,uploads:(v.uploads||[]).filter(x=>x.status!=='done').map(x=>({id:x.id,name:x.name,size:x.size,status:'failed',error:'刷新后请重新选择文件'}))};sessionStorage.setItem(draftNamespace,JSON.stringify({sid:state.sid,drafts}));}catch{/* Private mode or quota: current draft stays in memory. */}}
async function loadDrafts(){try{const who=await api('/api/account/me'),a=who.account;draftNamespace='pyharness.drafts.v1:'+JSON.stringify(a?[a.tenant,a.user_id||a.username]:['local']);const saved=JSON.parse(sessionStorage.getItem(draftNamespace)||'{}');const sessions=await get('sessions'),allowed=new Set(sessions.sessions.map(x=>x.sid));state.composers={};for(const [sid,v] of Object.entries(saved.drafts||{})){if((sid==='__new__'||allowed.has(sid))&&typeof v.text==='string'&&Array.isArray(v.attachments)){state.composers[sid]={...v,text:v.text.slice(0,32000),attachments:v.attachments.filter(x=>typeof x==='string').slice(0,10),pending:false};}}if(allowed.has(saved.sid))state.sid=saved.sid;}catch{/* Application remains usable without persisted drafts. */}}
function messageActions(m){if(!m.seq||!state.sid)return '';return `<div class="toolbar">${m.role==='user'?btn('编辑','message-edit',String(m.seq))+btn('重新发送','message-resend',String(m.seq)):btn('赞','feedback-up',String(m.seq))+btn('不赞同','feedback-down',String(m.seq))+btn('标记','feedback-flag',String(m.seq))}</div>`}
function attachmentCards(rows,editable=false){return `<div class="attachment-cards">${rows.map(r=>`<article class="attachment-card"><div>${r.preview_type==='image'?`<img data-attachment-image="${esc(r.artifact_id)}" alt="${esc(r.filename)}" width="72" height="54">`:icon('file')}<strong>${esc(r.filename||r.artifact_id)}</strong><small>${Number(r.size)||0} B</small></div><div>${btn('预览','artifact-preview',r.artifact_id)}${editable?btn('移除','attachment-remove',r.artifact_id)+btn('删除文件','attachment-delete',r.artifact_id,'danger'):''}</div></article>`).join('')}</div>`}
async function attachmentPreviews(){for(const img of [...document.querySelectorAll('[data-attachment-image]')].slice(0,20)){try{const d=await get('artifacts/'+encodeURIComponent(img.dataset.attachmentImage)+'/preview');if(img.isConnected&&d.image?.startsWith('data:image/'))img.src=d.image;}catch{if(img.isConnected)img.alt+='（预览不可用）';}}}
function drawAttachments(){const box=$('#attachmentList');if(!box)return;const owner=composer();box.innerHTML=attachmentCards(owner.attachments.map(id=>owner.files?.[id]||{artifact_id:id,filename:id}),true)+(owner.uploads||[]).filter(x=>x.status!=='done').map(x=>`<div class="attachment-card" role="status"><span>${esc(x.name)} · ${x.status==='uploading'?'上传中…':esc(x.error||'上传失败')}</span>${x.status==='failed'?btn('重试 / 重新选择','attachment-retry',x.id)+btn('移除','attachment-dismiss',x.id):''}</div>`).join('');attachmentPreviews();}
async function uploadAttachment(file,sid=state.sid,retryId=null){if(file.size>10*1024*1024)throw Error('文件上限 10 MB');if(!sid){rememberCompose();sid=(await post('sessions')).sid;if(!state.sid){state.composers[sid]=composer(null);state.sid=sid;}}const owner=composer(sid);owner.uploads??=[];owner.files??={};if(!retryId&&owner.attachments.length+owner.uploads.filter(x=>x.status!=='done').length>=10)throw Error('每条消息最多 10 个附件');const row=retryId?owner.uploads.find(x=>x.id===retryId):{id:crypto.randomUUID(),name:file.name,size:file.size};if(!row||row.status==='uploading')return;if(!retryId)owner.uploads.push(row);row.file=file;row.status='uploading';row.error='';saveDrafts();if(state.sid===sid)drawAttachments();try{const bytes=new Uint8Array(await file.arrayBuffer());let text='';for(let i=0;i<bytes.length;i+=8192)text+=String.fromCharCode(...bytes.subarray(i,i+8192));const item=await post('artifacts',{session_id:sid,filename:file.name,data_base64:btoa(text)});if(!owner.uploads.includes(row))return;owner.attachments.push(item.artifact_id);owner.files[item.artifact_id]={artifact_id:item.artifact_id,filename:item.filename,size:item.size,preview_type:item.preview_type};row.status='done';delete row.file;toast('附件已保存到所属会话；图片需勾选视觉输入才发送给模型');}catch(error){row.status='failed';row.error=error.message;toast(error.message);}finally{saveDrafts();if(state.sid===sid){if(!$('#compose'))await render();else restoreCompose();}}}
function composer(sid=state.sid){state.composers??={};return state.composers[sid||'__new__']??={text:'',agent:'',attachments:[]}}
function rememberCompose(){const form=$('#compose');if(!form)return;const saved=composer(form.dataset.sid||null);saved.text=$('#messageText')?.value||'';saved.agent=$('#agentSelect')?.value||'';saved.vision=$('#useVision')?.checked===true;saveDrafts()}
function restoreCompose(){const form=$('#compose');if(!form)return;form.dataset.sid=state.sid||'';const saved=composer();$('#messageText').value=saved.text;$('#sendFeedback').innerHTML=feedbackHTML(saved.feedback);$('#agentSelect').value=saved.agent;form.querySelector('button[type=submit]').disabled=!!saved.pending;const label=$('#attachmentCount');if(label)label.textContent=`附件 ${saved.attachments.length}`;if($('#useVision'))$('#useVision').checked=saved.vision===true;drawAttachments()}
async function render(quiet=false){rememberCompose();const page=(location.hash.slice(1)||'chat').split('?')[0];state.page=renderers[page]?page:'chat';const gen=++state.generation;if(!quiet)main.innerHTML='<div class="skeleton"></div><div class="skeleton" style="height:400px"></div>';try{const [html,sessions]=await Promise.all([renderers[state.page](),get('sessions')]);if(gen!==state.generation)return;const input=$('#messageText'),focus=input===document.activeElement,selection=input?[input.selectionStart,input.selectionEnd]:null;rememberCompose();$('#sessionList').innerHTML=sessions.sessions.map(s=>`<button data-session="${esc(s.sid)}" class="${s.sid===state.sid?'active':''}" title="${esc(s.title||s.sid)}">${esc(s.title||'未命名会话')}${s.archived?' · 已归档':''}</button>`).join('')||'<p class="muted">暂无会话</p>';main.innerHTML=html;restoreCompose();wireForms();if(quiet&&focus&&$('#messageText')){$('#messageText').focus();$('#messageText').setSelectionRange(...selection)}if(state.page==='chat'&&state.sid)connectStream(state.sid);else disconnectStream()}catch(e){if(gen!==state.generation)return;main.innerHTML=`<div class="error"><strong>加载失败</strong><p style="margin-top:10px">${esc(e.message)}</p>${btn('重试','refresh')}</div>`;console.error(e)}}
function disconnectStream(){if(state.stream){state.stream.close();state.stream=null}clearTimeout(state.refreshTimer)}
function connectStream(sid){if(state.stream?.sid===sid)return;disconnectStream();const stream=new EventSource(`/api/stream?sid=${encodeURIComponent(sid)}`);stream.sid=sid;state.stream=stream;const refresh=()=>{if(state.sid!==sid)return;clearTimeout(state.refreshTimer);state.refreshTimer=setTimeout(async()=>{if(state.page==='chat'){if(state.composing)state.refreshAfterComposition=true;else await render(true)}},500)};['system.error','llm.error','task.started','task.completed','task.failed','agent.message','tool.result','tool.error','approval.requested','approval.granted','approval.denied','user.question','user.answer','subagent.spawned','subagent.joined','subagent.failed'].forEach(k=>stream.addEventListener(k,refresh));stream.onopen=refresh;stream.onerror=()=>{if(state.sid===sid)toast('连接中断，正在恢复；重连后重新读取持久化消息')};stream.addEventListener('llm.chunk',event=>{try{const e=JSON.parse(event.data),delta=e.payload?.delta||e.delta||'';let draft=$('#streamDraft');if(!draft){draft=document.createElement('div');draft.id='streamDraft';draft.className='message';$('#messages')?.append(draft)}draft.textContent+=delta}catch(e){console.error('SSE 数据错误',e)}})}
async function newSession(agent=''){document.body.classList.remove('sessions-open');rememberCompose();const s=await post('sessions');state.sid=s.sid;state.run=null;composer().agent=agent;location.hash='chat';await render()}
function filePicker(accept,callback){const input=document.createElement('input');input.type='file';input.accept=accept;input.onchange=async()=>{try{if(input.files[0])await callback(input.files[0])}catch(e){toast(e.message)}};input.click()}

'agent-copy':async id=>{await post('agents/'+id+'/copy');toast('已复制为草稿');render()},

'agent-delete':async id=>{if(confirm('删除未发布草稿？')){await api('/api/v1/agents/'+id,{method:'DELETE'});render()}},
'knowledge-upload':()=>filePicker('.txt,.md,.json,.csv',async f=>{if(f.size>1048576)throw Error('文档上限 1 MB');await post('knowledge',{name:f.name,text:await f.text()});toast('文档已索引');go('knowledge')}),
'knowledge-delete':async id=>{if(confirm('删除此知识文档？')){await api('/api/v1/knowledge/'+id,{method:'DELETE'});render()}},
 'artifact-upload':()=>filePicker('',file=>uploadAttachment(file)),
'artifact-preview':async id=>{const d=await get('artifacts/'+id+'/preview');modal(d.record.filename,`<p class="muted">SHA256 ${esc(d.record.sha256)}</p>${d.image?`<img src="${esc(d.image)}" alt="产物图片预览" style="max-width:100%;max-height:65vh">`:d.record.filename.endsWith('.md')?`<article>${markdownPreview(d.text)}</article>`:`<pre>${esc(d.text)}</pre>`}${d.truncated?'<p>预览已截断</p>':''}`)},
'artifact-apply':async id=>{if(confirm('请求应用此 Patch？请先查看 Diff。随后仍需在审批中心批准。')){await post('artifacts/'+id+'/apply');toast('已请求受治理应用，请到审批中心处理');go('approvals')}},
'artifact-export':async id=>{await post('artifacts/'+id+'/export');toast('已请求导出批准');go('approvals')},
'artifact-delete':async id=>{if(confirm('删除文件及其可下载内容？')){await api('/api/v1/artifacts/'+id,{method:'DELETE'});render()}},
'sandbox-destroy':async id=>{if(confirm('销毁沙盒及其中的进程和临时文件？')){await post('sandboxes/'+id+'/destroy');render()}},
'model-new':()=>{modal('添加模型连接',`<form id="modelForm">${[['label','名称','text'],['model','模型名','text'],['base_url','API endpoint','url'],['api_key','API Key（只写）','password']].map(([id,label,type])=>`<label class="field">${label}<input id="model_${id}" type="${type}" required autocomplete="off"></label>`).join('')}<div class="toolbar"><button class="primary" type="submit">保存</button><button type="submit" value="test">保存并测试连接</button></div><small>测试前会再次提示可能产生的少量用量；单独保存不会发送模型请求。</small></form>`);$('#modelForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;if(form.dataset.pending)return;form.dataset.pending='1';const test=e.submitter?.value==='test';form.querySelectorAll('button').forEach(b=>b.disabled=true);try{const saved=await api('/api/settings/models',{method:'POST',body:JSON.stringify(Object.fromEntries(['label','model','base_url','api_key'].map(k=>[k,$('#model_'+k).value])))});$('#dialog').close();toast('模型已保存');await render();if(test)await actions['model-test'](saved.profile.id)}catch(err){toast(err.message)}finally{delete form.dataset.pending;form.querySelectorAll('button').forEach(b=>b.disabled=false)}}},
'model-activate':async id=>{await api('/api/settings/models/'+encodeURIComponent(id)+'/activate',{method:'POST',body:'{}'});toast('已启用；新会话采用此配置');render()},
'model-delete':async id=>{if(confirm('删除此模型连接？')){await api('/api/settings/models/'+encodeURIComponent(id),{method:'DELETE'});render()}},
'schedule-new':async()=>{const d=await get('agents');modal('创建计划任务',`<form id="scheduleForm"><label class="field">名称（小写字母开头，可含数字、下划线和点）<input id="scheduleName" pattern="[a-z][a-z0-9_.]{1,63}" required></label><label class="field">Agent 发布版本<select id="scheduleAgent"><option value="">默认助手 · 禁止执行</option>${d.agents.filter(a=>a.current_version&&a.status!=='deprecated').map(a=>`<option value="${a.agent_id}~${a.current_version}">${esc(a.name)} v${a.current_version}</option>`).join('')}</select></label><label class="field">间隔（秒）<input id="scheduleExpr" type="number" value="3600" min="60" required></label><label class="field">执行意图<textarea id="scheduleIntent" style="min-height:100px" required></textarea></label><p class="warning">计划会新建专用会话，固定 Agent 版本；高风险操作仍需要人工审批。程序关闭时不会运行。</p><button class="primary">创建</button></form>`);$('#scheduleForm').onsubmit=async e=>{e.preventDefault();try{const [agent_id,version]=$('#scheduleAgent').value.split('~');await post('schedules',{action:'add',agent_id:agent_id||null,agent_version:Number(version)||null,name:$('#scheduleName').value,kind:'interval',expr:$('#scheduleExpr').value,intent:$('#scheduleIntent').value});$('#dialog').close();go('schedules')}catch(err){toast(err.message)}}}

};
actions['attachment-remove']=async id=>{const c=composer();c.attachments=c.attachments.filter(x=>x!==id);saveDrafts();restoreCompose()};
actions['attachment-delete']=async id=>{const sid=state.sid;if(!confirm('永久删除此已上传文件？已发送消息可能无法再预览。'))return;await api('/api/v1/artifacts/'+encodeURIComponent(id),{method:'DELETE'});const c=composer(sid);c.attachments=c.attachments.filter(x=>x!==id);delete c.files?.[id];saveDrafts();if(state.sid===sid)restoreCompose()};
actions['attachment-dismiss']=async id=>{const c=composer();c.uploads=(c.uploads||[]).filter(x=>x.id!==id);saveDrafts();drawAttachments()};
actions['attachment-retry']=async id=>{const sid=state.sid,row=composer(sid).uploads.find(x=>x.id===id);if(row?.file)await uploadAttachment(row.file,sid,id);else filePicker('',file=>uploadAttachment(file,sid,id))};
actions['model-vision']=async id=>{const d=await get('connections'),p=d.models.profiles.find(x=>x.id===id);if(!p)return;const value=confirm('确认服务文档支持该模型接收图片？确定=声明支持，取消=关闭图片输入。此操作不发模型请求。');await api('/api/settings/models',{method:'POST',body:JSON.stringify({id:p.id,label:p.label,model:p.model,base_url:p.base_url,supports_vision:value})});await render()};
actions['message-edit']=async seq=>{const sid=state.sid,d=await api(`/api/sessions/${encodeURIComponent(sid)}/messages`),m=d.messages.find(x=>x.seq===Number(seq));if(!m)return;modal('编辑历史消息',`<form id="editMessageForm"><textarea name="text" maxlength="32000" required>${esc(m.content)}</textarea><p class="muted">只追加编辑记录；不自动重发或调用模型。活动任务期间不可编辑。</p><button>保存</button></form>`);$('#editMessageForm').onsubmit=async event=>{event.preventDefault();try{await post(`sessions/${encodeURIComponent(sid)}/messages/${seq}/edit`,{text:event.target.text.value});$('#dialog').close();if(state.sid===sid)await render()}catch(error){toast(error.message)}}};
actions['message-resend']=async seq=>{const sid=state.sid,d=await api(`/api/sessions/${encodeURIComponent(sid)}/messages`),m=d.messages.find(x=>x.seq===Number(seq));if(!m)return;if(!confirm('把这条内容放入草稿？确认后仍需点击发送，按本会话 Agent 的治理策略运行。'))return;const c=composer(sid);c.text=m.content;c.attachments=(m.attachments||[]).map(x=>x.artifact_id);c.files=Object.fromEntries((m.attachments||[]).map(x=>[x.artifact_id,x]));saveDrafts();if(state.sid===sid)restoreCompose()};
for(const kind of ['up','down','flag'])actions['feedback-'+kind]=async seq=>{await post(`sessions/${encodeURIComponent(state.sid)}/messages/${seq}/feedback`,{kind});toast('反馈已保存')};
actions['session-activity']=async sid=>{const d=await get(`sessions/${encodeURIComponent(sid)}/activity`);modal('目标、待办与计划记录',`<p>当前显示已有工具产生的真实事件。计划审批请使用 CLI plan 入口；手动压缩尚未在 Web 开放，自动压缩可能调用模型。</p>${d.events.length?`<pre>${esc(JSON.stringify(d.events,null,2))}</pre>`:empty('暂无目标、待办或计划事件')}${d.truncated?'<p>仅显示最近 200 项</p>':''}`)};
actions['session-jobs']=async sid=>{const d=await api(`/api/sessions/${encodeURIComponent(sid)}/jobs`);modal('后台任务',`<p>后台 Job 与子 Agent 是不同资源；此处仅显示和取消既有 Job。</p><pre>${esc(JSON.stringify(d,null,2))}</pre><form id="cancelJobForm"><label class="field">要取消的 Job ID<input name="job" required></label><button>取消任务</button></form>`);$('#cancelJobForm').onsubmit=async event=>{event.preventDefault();try{await post(`sessions/${encodeURIComponent(sid)}/jobs/${encodeURIComponent(event.target.job.value)}/cancel`);await actions['session-jobs'](sid)}catch(error){toast(error.message)}}};
actions['subtask-cancel']=async value=>{const [sid,id]=value.split('~');await post(`sessions/${encodeURIComponent(sid)}/subagents/${encodeURIComponent(id)}/cancel`);await actions.subtasks(sid)};
actions['agent-test']=async id=>{await newSession(id)};

actions.memory=async()=>{const d=await get('memory');modal('团队记忆',`<p>仅当前团队共享，跨会话保留。Agent 默认仍使用会话记忆；发布版本需显式选择 team 范围并允许 storage.kv 才能访问。不要保存 API Key 或密码。</p><p>已有键：${esc(d.result)}</p><form id="memoryForm"><label class="field">键<input name="key" pattern="[A-Za-z0-9_.-]{1,64}" required></label><label class="field">操作<select name="op"><option value="get">读取</option><option value="set">保存</option><option value="delete">删除</option></select></label><label class="field">内容<textarea name="value" maxlength="4096"></textarea></label><button>执行</button><p role="status"></p></form>`);$('#memoryForm').onsubmit=async event=>{event.preventDefault();const form=event.target,button=form.querySelector('button');if(button.disabled)return;button.disabled=true;const body=Object.fromEntries(new FormData(form));try{const result=body.op==='get'?await get('memory?key='+encodeURIComponent(body.key)):await post('memory',body);form.querySelector('[role=status]').textContent=result.result}catch(error){form.querySelector('[role=status]').textContent=error.message}finally{button.disabled=false}}};


actions.workflows=async()=>{const d=await get('workflows');modal('工作流',`<p class="muted">按顺序运行，每步复用任务队列；失败即停。关闭页面不会停止服务中的工作，退出程序会取消在途工作。</p><button data-action="workflow-new">创建工作流</button>${d.workflows.map(w=>`<div class="row"><div class="grow"><strong>${esc(w.name)}</strong><p>${badge(w.status)} ${w.completed_steps}/${w.total_steps} 步</p><small>${esc(w.session_id)}</small></div>${w.status==='running'?btn('取消','workflow-cancel',w.workflow_id):''}</div>`).join('')||'<p>暂无工作流</p>'}`)};
actions['workflow-new']=()=>{const key=crypto.randomUUID();modal('创建工作流',`<form id="workflowForm"><label class="field">名称<input name="name" maxlength="100" required></label><label class="field">步骤（每行一个意图，最多 20 步）<textarea name="steps" required></textarea></label><p>使用默认助手，代码执行禁用。模型连接必须已配置。</p><button class="primary">提交</button><p role="status" id="workflowStatus"></p></form>`);$('#workflowForm').onsubmit=async event=>{event.preventDefault();const form=event.target,button=form.querySelector('button');if(button.disabled)return;button.disabled=true;try{await post('workflows',{name:form.elements.name.value,steps:form.elements.steps.value.split('\n').map(s=>s.trim()).filter(Boolean),idempotency_key:key});await actions.workflows()}catch(error){$('#workflowStatus').textContent=error.message;button.disabled=false}}};
actions['workflow-cancel']=async id=>{await post('workflows/'+encodeURIComponent(id)+'/cancel');await actions.workflows()};

actions['version-copy']=async id=>{const [agent,version]=id.split('~');await post('agents/'+agent+'/copy',{version:Number(version)});$('#dialog').close();render()};
actions['version-deprecate']=async id=>{const [agent,version]=id.split('~');await post('agents/'+agent+'/deprecate-version',{version:Number(version)});toast('此版本已禁止新会话使用；历史运行保留')};
actions['version-diff']=async id=>{const [agent,version]=id.split('~');const d=await post('agents/'+agent+'/diff',{from:Number(version)-1,to:Number(version)});modal('版本差异',`<pre>${esc(d.diff||'无差异')}</pre>`)};
actions['attachments-clear']=()=>{rememberCompose();composer().attachments=[];composer().uploads=[];saveDrafts();restoreCompose()};
actions['session-archive']=async id=>{const s=(await get('sessions')).sessions.find(s=>s.sid===id);await post('sessions/'+id+'/metadata',{archived:!s.archived});render()};
actions['session-tags']=async id=>{const title=prompt('会话标题');if(title===null)return;const tags=prompt('标签，用逗号分隔')||'';await post('sessions/'+id+'/metadata',{title,tags:tags.split(',').map(t=>t.trim()).filter(Boolean)});render()};
actions['knowledge-retry']=async id=>{await post('knowledge/'+id+'/retry');toast('索引已重新验证');render()};
actions['knowledge-replace']=id=>filePicker('.txt,.md,.json,.csv',async f=>{if(f.size>1048576)throw Error('文档上限 1 MB');await post('knowledge/'+id+'/replace',{text:await f.text()});render()});
actions['knowledge-provider']=async()=>{const d=await get('connections');const choices=['exact_keyword',...d.connections.filter(c=>c.type==='remote_rag').map(c=>c.connection_id)];const provider=prompt('选择 Provider：'+choices.join('，'),'exact_keyword');if(provider){await post('knowledge/settings/provider',{provider});render()}};
actions['usage-filter']=()=>{const text=prompt('筛选 JSON：支持 from / to（带时区 ISO）、session_id、agent_id、run_id、model、tool',JSON.stringify(state.usageFilter||{}));if(text!==null){state.usageFilter=JSON.parse(text);render()}};
actions['skills-reload']=async()=>{await api('/api/skills/reload',{method:'POST',body:'{}'});render()};
actions['connection-new']=()=>{modal('添加受信任连接',`<p class="warning">MCP 命令会在宿主执行，不接受命令行密钥。RAG 仅访问明确配置的 endpoint，文档会发送给该服务。</p><form id="connectionForm"><textarea id="connectionJson" aria-label="连接 JSON">${esc(JSON.stringify({type:'mcp',config:{name:'example',command:['python','server.py'],enabled:false}},null,2))}</textarea><p>远程 RAG：{"type":"remote_rag","name":"rag","endpoint":"https://rag.example.test"}</p><button class="primary">保存</button></form>`);$('#connectionForm').onsubmit=async e=>{e.preventDefault();try{await post('connections',JSON.parse($('#connectionJson').value));$('#dialog').close();render()}catch(err){toast(err.message)}}};
for(const action of ['test','start','stop','enable','disable','delete'])actions['connection-'+action]=async id=>{if(['start','test','delete'].includes(action)&&!confirm('确认对这个受信任连接执行 '+action+'？MCP 测试和启动会运行宿主命令。'))return;const r=await post('connections/'+encodeURIComponent(id)+'/'+action);toast(r.status||'已更新');render()};
actions['model-test']=async id=>{state.modelProbes??=new Set();if(state.modelProbes.has(id))return;if(!confirm('发送一次最小生成请求，可能产生少量模型费用。最多 64 输出 Token、60 秒，无工具、自动重试或 fallback；这不是完整 Agent 能力验证。'))return;state.modelProbes.add(id);modal('模型连接测试',`<p role="status">测试中，请稍候…</p>`);try{const d=await post('connections/model:'+id+'/test');showJSON('模型连接测试',d)}catch(error){modal('模型连接测试',`<p role="alert">${esc(error.message)}</p>`)}finally{state.modelProbes.delete(id)}};
actions['model-rotate']=async id=>{const profiles=(await get('connections')).models.profiles;const row=profiles.find(p=>p.id===id);modal('替换密钥',`<form id="rotate"><label class="field">新 API Key<input id="replacementKey" type="password" autocomplete="off" required></label><button class="primary">替换</button></form>`);$('#rotate').onsubmit=async e=>{e.preventDefault();try{await api('/api/settings/models',{method:'POST',body:JSON.stringify({id,label:row.label,base_url:row.base_url,model:row.model,api_key:$('#replacementKey').value})});$('#dialog').close();toast('密钥已替换；请创建新会话')}catch(err){toast(err.message)}}};
for(const action of ['pause','resume','remove','run_now'])actions['schedule-'+action]=async id=>{const [session_id,name]=id.split('~');if(action==='remove'&&!confirm('删除计划任务？执行历史将保留。'))return;await post('schedules',{session_id,name,action});toast('计划任务已更新');render()};
actions['schedule-edit']=async id=>{const [session_id,name]=id.split('~');const row=(await get('schedules')).schedules.find(j=>j.session_id===session_id&&j.name===name);modal('编辑计划任务',`<form id="editSchedule"><label class="field">间隔 / cron 表达式<input id="editExpr" value="${esc(row.expr)}" required></label><label class="field">执行意图<textarea id="editIntent" style="min-height:140px" required>${esc(row.intent)}</textarea></label><button class="primary">保存</button></form>`);$('#editSchedule').onsubmit=async e=>{e.preventDefault();try{await post('schedules',{session_id,name,action:'edit',kind:row.kind,expr:$('#editExpr').value,intent:$('#editIntent').value});$('#dialog').close();render()}catch(error){toast(error.message)}}};
actions.questions=async()=>{const d=await api('/api/asks/pending');state.questions=d.pending;modal('待答问题',d.pending.map(q=>`<div class="card"><h3>${esc(q.question)}</h3><p class="muted">${esc(q.session_id)}</p>${btn('回答','question-answer',q.session_id+'~'+q.ask_id)}</div>`).join('')||empty('暂无待答问题'))};
actions['question-answer']=id=>{const q=state.questions.find(q=>q.session_id+'~'+q.ask_id===id);if(!q)return;modal('回答问题',`<p>${esc(q.question)}</p><form id="answerForm">${q.options.length?`<label class="field">选择<select id="answerChoice"><option value="">输入自己的答复</option>${q.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`:''}<label class="field">补充答复<textarea id="answerText" maxlength="2000" style="min-height:120px"></textarea></label><button class="primary">提交答复</button></form>`);$('#answerForm').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');if(button.disabled)return;button.disabled=true;try{await api(`/api/asks/${encodeURIComponent(q.session_id)}/${q.ask_id}`,{method:'POST',body:JSON.stringify({choice:$('#answerChoice')?.value||null,text:$('#answerText').value})});$('#dialog').close();toast('答复已保存')}catch(error){toast(error.message)}finally{button.disabled=false}}};
actions.account=async()=>{const d=await api('/api/account/me');if(d.mode==='local_operator'){modal('账户与团队',`<p>为团队创建账户。密码只用于 PyHarness 登录，与模型 API Key 无关。</p><form id="accountCreate"><label class="field">账户<input name="username" required minlength="3" maxlength="64" autocomplete="off"></label><label class="field">初始密码<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label class="field">团队 ID<input name="tenant" required maxlength="64"></label><button class="primary">创建账户</button></form><p><a href="/login" target="_blank" rel="noopener">打开团队登录页</a></p>`);$('#accountCreate').onsubmit=async event=>{event.preventDefault();const form=event.target,button=form.querySelector('button');if(button.disabled)return;button.disabled=true;try{const result=await api('/api/account/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});showJSON('账户已创建',result)}catch(error){toast(error.message)}finally{form.password.value='';button.disabled=false}};return}const a=d.account;modal('账户与团队',`<h3>${esc(a.username)}</h3><p>团队：${esc(a.tenant)} · 角色：${esc(a.role)}</p><p>账户仅访问所属团队；交互式终端和宿主扩展不向团队账户开放。</p>${a.role==='owner'?`<form id="memberForm"><label class="field">已有账户<input name="username" required></label><label class="field">角色<select name="role"><option value="member">成员</option><option value="viewer">只读</option><option value="owner">管理员</option><option value="remove">移除</option></select></label><button>更新成员权限</button></form>`:''}${btn('退出登录','account-logout')}`);if($('#memberForm'))$('#memberForm').onsubmit=async event=>{event.preventDefault();try{await api('/api/account/members',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});toast('成员权限已更新')}catch(error){toast(error.message)}}};
actions['account-logout']=async()=>{await api('/api/account/logout',{method:'POST',body:'{}'});location.replace('/login')};
actions.subtasks=async sid=>{const d=await api(`/api/sessions/${encodeURIComponent(sid)}/subagents`);modal('子任务',`<p class="muted">子任务共享父任务的权限边界；历史来自持久化委派事件。</p>${d.history.length?d.history.map(r=>`<div class="row"><div class="grow"><strong>${esc(r.task)}</strong><p>${esc(r.session_id)}</p><p>${esc(r.summary||r.error_code||'')}</p></div>${badge(r.status)}${['running','joining','spawning'].includes(r.status)?btn('取消','subtask-cancel',sid+'~'+r.session_id,'danger'):''}</div>`).join(''):empty('暂无子任务')}`)};
function wireForms(){const compose=$('#compose');if(compose)compose.onsubmit=async e=>{e.preventDefault();rememberCompose();const requestSid=state.sid,owner=composer(requestSid),text=owner.text.trim();if(!text||owner.pending)return;if((owner.uploads||[]).some(x=>x.status!=='done')){toast('请先完成上传或移除失败附件');return;}owner.pending=true;showSendFeedback(owner,{text:'正在提交任务，请勿重复发送…'});const select=$('#agentSelect'),option=select.selectedOptions[0],body={text,session_id:requestSid,artifact_ids:[...owner.attachments],use_vision:owner.vision===true};if(select.value&&!state.bound){body.agent_id=select.value;body.agent_version=Number(option.dataset.version)}const button=compose.querySelector('button[type=submit]');button.disabled=true;try{const result=await post('runs',body);if(!result?.run_id||!result?.session_id){const e=Error('服务未返回可追踪的 Run');e.code='invalid_response';throw e}showSendFeedback(owner,{text:'任务已提交，Run：'+result.run_id});rememberCompose();if(owner.text.trim()===text)owner.text='';owner.attachments=owner.attachments.filter(id=>!body.artifact_ids.includes(id));saveDrafts();if(!requestSid)state.composers[result.session_id]=owner;if(state.sid===requestSid){state.sid=result.session_id;if($('#compose')===compose)$('#messageText').value=owner.text;await render()}else toast('任务已在原会话提交')}catch(err){showSendFeedback(owner,feedbackFor(err));toast(err.message)}finally{owner.pending=false;button.disabled=false;if(state.sid===requestSid&&$('#compose'))$('#compose button[type=submit]').disabled=false}};const input=$('#messageText');if(input){let composing=false;input.addEventListener('input',rememberCompose);input.addEventListener('compositionstart',()=>{composing=true;state.composing=true});input.addEventListener('compositionend',()=>{composing=false;state.composing=false;if(state.refreshAfterComposition){state.refreshAfterComposition=false;render(true)}});input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.ctrlKey&&!event.altKey&&!event.metaKey&&!event.repeat&&!event.isComposing&&!composing&&event.keyCode!==229){event.preventDefault();compose.requestSubmit()}})}if($('#agentSelect'))$('#agentSelect').onchange=()=>{rememberCompose();refreshModelHint()};refreshModelHint();const q=$('#knowledgeQuery');if(q)q.onsubmit=async e=>{e.preventDefault();try{showJSON('检索证据',await post('knowledge/query',{query:$('#queryText').value}))}catch(err){toast(err.message)}};const s=$('#sessionSearch');if(s)s.oninput=()=>document.querySelectorAll('#sessionList [data-session]').forEach(b=>b.hidden=!b.textContent.includes(s.value));if(s)s.oninput();$('#messages')?.scrollTo(0,$('#messages').scrollHeight)}
document.addEventListener('click',async e=>{const target=e.target.closest('[data-nav],[data-action],[data-session],[data-filter]');if(!target)return;e.preventDefault();try{if(target.dataset.session){rememberCompose();state.sid=target.dataset.session;document.body.classList.remove('sessions-open');disconnectStream();go('chat')}else if(target.dataset.nav){document.body.classList.remove('sessions-open');go(target.dataset.nav)}else if(target.dataset.filter){state.approvalTab=target.dataset.filter;render()}else if(actions[target.dataset.action])await actions[target.dataset.action](target.dataset.id)}catch(err){toast(err.message);console.error(err)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}});
$('#globalSearch').onkeydown=async e=>{if(e.key==='Enter'){const q=e.target.value.trim();const found=pages.find(p=>p[1].includes(q));if(found)go(found[0]);else{const d=await get('history/search?'+new URLSearchParams({q}));modal('历史全文搜索',d.hits.length?d.hits.map(h=>`<div class="row"><a href="#chat" data-session="${esc(h.session_id)}">${esc(h.snippet)} <small>事件 ${h.seq}</small></a></div>`).join(''):empty(d.timed_out?'搜索超时，请重试':'没有匹配内容'))}}};
$('#theme').onclick=actions.theme;try{if(localStorage.getItem('ph-theme')==='dark')document.body.classList.add('dark');}catch{}window.addEventListener('hashchange',()=>render());window.addEventListener('beforeunload',()=>{rememberCompose();saveDrafts();disconnectStream()});loadDrafts().finally(()=>render());
api('/api/account/me').then(d=>{const a=d.account;$('#accountName').textContent=a?a.username:'本地操作者';$('#accountRole').textContent=a?({owner:'团队管理员',member:'团队成员',viewer:'只读成员'}[a.role]||a.role):'受治理的 Agent Runtime';$('#workspaceName').textContent=a?a.tenant:'本地工作区';$('#tenantLabel').textContent=a?'团队工作区':'独立运行'}).catch(()=>{$('#accountRole').textContent='身份信息暂不可用'});
</script><script type="module" src="/assets/host-adapters/platform.js"></script></body></html>
