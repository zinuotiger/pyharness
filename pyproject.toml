[project]
name = "pyharness"
version = "0.1.0"
description = "DSH 架构思想的 Python 复刻 - Agent 框架(66 功能/6 阶段)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
desktop = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]
pty = [
    "pywinpty>=3.0; sys_platform == 'win32'",
]
native = [
    "PySide6>=6.7",
    "qasync>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "pywebview>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PySide6>=6.7",
    "qasync>=0.27",
    "pywinpty>=3.0; sys_platform == 'win32'",
]

[project.scripts]
pyharness = "pyharness.cli:main"
pyharness-desktop = "pyharness.desktop:main"
pyharness-native = "pyharness.desktop_native:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"examples" = "examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --cov=pyharness --cov-report=term-missing"
markers = [
    "e2e: 真实 LLM/网络测试,默认跳过(手动 -m e2e 运行)",
    "invariant: 全库不变量测试(INV-01~09)",
]
