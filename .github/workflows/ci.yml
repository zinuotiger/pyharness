name: CI

on:
  push:
    branches: [main, codex/pyharness-engineering-rc-20260924]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COV_FLOOR: "75"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / full, permissions, package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Minimal Linux Qt offscreen dynamic libraries (no desktop or display service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - name: Clean environment from frozen uv.lock (includes declared native test dependencies)
        id: prepare
        run: python -B scripts/ci_verify.py prepare --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Authorization AST and governance read-side gates; Git whitespace
        run: python -B scripts/ci_verify.py static --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Host configuration, process and network isolation sentinels
        run: python -B scripts/ci_verify.py test --suite isolation --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Full pytest without ignored modules; coverage at least 75 percent
        run: python -B scripts/ci_verify.py test --suite full --cov-fail-under "${{ env.COV_FLOOR }}" --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: High-risk remediation regression (including real loopback listeners)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python -B scripts/ci_verify.py test --suite high-risk --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Platform APIs, approval/artifact contracts, fail-closed and model smoke safety
        run: python -B scripts/ci_verify.py test --suite platform --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Twelve Web pages in existing Edge or Chrome; real API and SSE
        run: python -B scripts/platform_ci.py browser --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Python syntax, public path, secret and fixed-demo-data scan
        run: python -B scripts/platform_ci.py scan --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: R02 real POSIX permissions; non-root; umask 022; no skipped cases
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && runner.os == 'Linux' }}
        run: python -B scripts/ci_verify.py test --suite posix --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Wheel and sdist; external clean base installation; Windows optional entry prechecks
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python -B scripts/ci_verify.py package --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Upload allowlisted summaries, sanitized JUnit and distribution archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}-py${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pyharness-ci/artifacts/*-summary.json
            ${{ runner.temp }}/pyharness-ci/artifacts/environment.json
            ${{ runner.temp }}/pyharness-ci/artifacts/junit-*.xml
            ${{ runner.temp }}/pyharness-ci/artifacts/packages/*.whl
            ${{ runner.temp }}/pyharness-ci/artifacts/packages/*.tar.gz
            ${{ runner.temp }}/pyharness-ci/artifacts/packages/SHA256SUMS.txt
            ${{ runner.temp }}/pyharness-ci/artifacts/browser/*.png
          retention-days: 7
          if-no-files-found: warn

  docker:
    name: Ubuntu 24.04 / real Docker Sandbox / governed code-change
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Real daemon evidence and controlled versioned image
        run: |
          docker version
          docker info
          docker pull python:3.13.2-slim-bookworm
          docker image inspect python:3.13.2-slim-bookworm --format '{{json .RepoDigests}}'
      - name: Minimal Linux Qt libraries for shared locked test environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - name: Locked isolated test environment
        run: python -B scripts/ci_verify.py prepare --output-dir "${{ runner.temp }}/pyharness-docker"
      - name: Real containers, isolation, bounded resources, cancellation and governed patch E2E; no skips
        run: python -B scripts/ci_verify.py test --suite docker --output-dir "${{ runner.temp }}/pyharness-docker"
      - name: Patch rollback/baseline, APIs and approval regression
        run: python -B scripts/ci_verify.py test --suite platform --output-dir "${{ runner.temp }}/pyharness-docker"
      - name: Browser health must report real Docker available
        run: python -B scripts/platform_ci.py browser --expect-docker available --output-dir "${{ runner.temp }}/pyharness-docker"
      - name: Public output and syntax scan
        run: python -B scripts/platform_ci.py scan --output-dir "${{ runner.temp }}/pyharness-docker"
      - name: Check no managed container remains
        if: always()
        shell: bash
        run: |
          remaining="$(docker ps -aq --filter label=pyharness.managed=true)"
          if [ -n "$remaining" ]; then
            echo "Owned sandbox residue detected; job failed"
            docker rm -f $remaining
            exit 1
          fi
      - name: Upload sanitized Docker facts and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-docker-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pyharness-docker/artifacts/*-summary.json
            ${{ runner.temp }}/pyharness-docker/artifacts/junit-*.xml
            ${{ runner.temp }}/pyharness-docker/artifacts/browser/*.png
          retention-days: 7
          if-no-files-found: warn

  gates:
    name: Windows / Python 3.13 / security, acceptance, e2e, invariants, structure
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          enable-cache: false
      - name: Clean locked dependency environment
        run: python -B scripts/ci_verify.py prepare --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Security gate
        run: python -B scripts/ci_verify.py test --suite security --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Acceptance gate
        run: python -B scripts/ci_verify.py test --suite acceptance --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: End-to-end governed runtime gate (deterministic model)
        run: python -B scripts/ci_verify.py test --suite e2e --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Invariants gate
        run: python -B scripts/ci_verify.py test --suite invariants --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Structure and shell-service contract gate
        run: python -B scripts/ci_verify.py test --suite structural --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Production authorization and governance reachability gate
        run: python -B scripts/ci_verify.py static --output-dir "${{ runner.temp }}/pyharness-ci"
      - name: Upload sanitized gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-layered-gates-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pyharness-ci/artifacts/*-summary.json
            ${{ runner.temp }}/pyharness-ci/artifacts/environment.json
            ${{ runner.temp }}/pyharness-ci/artifacts/junit-*.xml
          retention-days: 7
          if-no-files-found: warn
