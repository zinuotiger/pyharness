<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PyHarness Desktop</title>
<style>
:root {
  --bg: #f4f6fa; --panel: #ffffff; --panel2: #eef1f7; --border: #d9dfeb;
  --text: #1c2433; --muted: #5d6b84; --accent: #2563eb; --accent2: #3b82f6;
  --ok: #15803d; --warn: #b45309; --danger: #dc2626; --user: #dbeafe;
  --mono: "Cascadia Code", Consolas, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden; }

/* ===== 顶栏 ===== */
header { display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
header .logo { font-weight:700; font-size:15px; letter-spacing:.5px; }
header .logo b { color:var(--accent); }
header .sub { color:var(--muted); font-size:12px; }
#budget-chip { margin-left:auto; font-size:12px; color:var(--muted); background:var(--panel2); border:1px solid var(--border); border-radius:20px; padding:2px 12px; }
#budget-chip.warn { color:var(--warn); border-color:var(--warn); }

/* ===== 三栏主体 ===== */
main { flex:1; display:flex; min-height:0; }

/* 左:会话列表 */
#sidebar { width:230px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
#sidebar h3 { font-size:12px; color:var(--muted); padding:10px 12px 6px; letter-spacing:1px; }
#session-list { flex:1; overflow-y:auto; }
.sess { padding:9px 12px; cursor:pointer; border-left:3px solid transparent; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; }
.sess:hover { background:var(--panel2); color:var(--text); }
.sess.active { background:var(--panel2); border-left-color:var(--accent); color:var(--text); }
.sess .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; }
.sess .sid-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#session-menu { position:fixed; display:none; min-width:150px; padding:5px; z-index:160; background:var(--panel2); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.45); }
#session-menu.show { display:block; }
#session-menu button { width:100%; border:0; border-radius:5px; padding:8px 10px; text-align:left; color:var(--danger); background:transparent; cursor:pointer; font-size:13px; }
#session-menu button:hover { background:rgba(220,70,70,.12); }
#new-session { margin:10px; padding:8px; background:var(--accent); color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
#new-session:hover { background:var(--accent2); }

/* 中:对话流 */
#chat { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
#messages { flex:1; overflow-y:auto; padding:16px; }
.msg { margin-bottom:14px; max-width:78%; }
.msg .who { font-size:11px; color:var(--muted); margin-bottom:3px; }
.msg .bubble { padding:9px 13px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
.msg.user { margin-left:auto; }
.msg.user .bubble { background:var(--user); border:1px solid #b7c9ec; }
.msg.agent .bubble { background:var(--panel2); border:1px solid var(--border); }
.msg.system { max-width:100%; text-align:center; margin:6px 0; }
.msg.system .bubble { background:transparent; color:var(--muted); font-size:12px; padding:2px; }
.msg.tool .bubble { font-family:var(--mono); font-size:12px; background:#e8edf5; }
.typing { color:var(--muted); font-size:12px; padding:4px 2px; animation:blink 1.2s infinite; }
@keyframes blink { 50% { opacity:.3; } }

#input-bar { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--border); background:var(--panel); }
#input-bar input { flex:1; padding:10px 12px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; outline:none; }
#input-bar input:focus { border-color:var(--accent); }
#input-bar button { padding:10px 22px; background:var(--accent); color:#fff; border:0; border-radius:8px; font-weight:600; cursor:pointer; }
#input-bar button:hover { background:var(--accent2); }
#input-bar button:disabled { opacity:.5; cursor:not-allowed; }

/* 右:轨迹时间线 */
#timeline-pane { width:380px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
#timeline-pane h3 { font-size:12px; color:var(--muted); padding:10px 12px 6px; letter-spacing:1px; }
#timeline { flex:1; overflow-y:auto; padding:4px 8px 12px; }
.tl-node { display:flex; gap:10px; padding:6px 4px; border-left:2px solid var(--border); margin-left:8px; position:relative; cursor:pointer; }
.tl-node::before { content:""; position:absolute; left:-6px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--border); }
.tl-node[data-sev=success]::before { background:var(--ok); }
.tl-node[data-sev=warn]::before { background:var(--warn); }
.tl-node[data-sev=danger]::before { background:var(--danger); }
.tl-node[data-sev=info]::before { background:var(--accent); }
.tl-node .seq { font-family:var(--mono); font-size:10px; color:var(--muted); padding-top:2px; width:28px; text-align:right; flex:none; }
.tl-node .body { flex:1; min-width:0; }
.tl-node .title { font-size:13px; }
.tl-node .meta { font-size:10px; color:var(--muted); font-family:var(--mono); }
.tl-node .detail { font-size:11px; color:var(--muted); margin-top:2px; white-space:pre-wrap; word-break:break-all; display:none; max-height:120px; overflow-y:auto; }
.tl-node.open .detail { display:block; }
.tl-node[data-k=guard] .title { color:var(--danger); }
.tl-node[data-k=approval] .title { color:var(--warn); }
.tl-node[data-k=tool] .title { color:var(--accent2); }
.tl-node[data-k=message] .title { color:var(--ok); }
.tl-node[data-k=user] .title { color:var(--text); }
.tl-node[data-k=budget] .title { color:var(--warn); }
#timeline-empty { color:var(--muted); font-size:12px; text-align:center; padding:30px 10px; }

/* ===== 审批弹窗 ===== */
#modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:100; }
#modal-bg.show { display:flex; }
#modal { width:520px; max-width:92vw; background:var(--panel2); border:1px solid var(--warn); border-radius:12px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
#modal h2 { color:var(--warn); font-size:16px; margin-bottom:6px; }
#modal .tool-name { font-family:var(--mono); color:var(--text); background:var(--panel); padding:3px 8px; border-radius:5px; display:inline-block; margin:8px 0; font-size:13px; }
#modal .args { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px; font-family:var(--mono); font-size:12px; white-space:pre-wrap; max-height:160px; overflow-y:auto; color:var(--muted); }
#modal .risk { margin:10px 0; font-size:12px; }
#modal .risk b.critical { color:var(--danger); } #modal .risk b.high { color:var(--danger); } #modal .risk b.medium { color:var(--warn); }
#modal .btns { display:flex; gap:10px; margin-top:16px; }
#modal .btns button { flex:1; padding:10px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; border:0; }
#btn-deny { background:#fdeaea; color:var(--danger); border:1px solid var(--danger) !important; }
#btn-approve { background:var(--accent); color:#fff; }
#btn-deny:hover { background:#f8d7d7; } #btn-approve:hover { background:var(--accent2); }
#msg-ops { display:flex; align-items:center; gap:6px; padding:6px 12px; border-top:1px solid var(--border); }
#msg-ops .op { background:var(--panel); border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer; }
#msg-ops .op:hover { color:var(--text); border-color:var(--accent); }
#msg-ops .op-sep { flex:1; }
#ask-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:110; }
#ask-bg.show { display:flex; }
#ask-panel { width:520px; max-width:92vw; background:var(--panel2); border:1px solid var(--accent); border-radius:12px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
#ask-panel h2 { color:var(--accent); font-size:16px; margin-bottom:6px; }
#ask-options { display:flex; flex-direction:column; gap:8px; }
#ask-options button { text-align:left; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; font-size:13px; }
#ask-options button:hover { border-color:var(--accent); }
#toolbar { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-left:auto; flex-wrap:wrap; }
#toolbar select, #toolbar .tb { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer; }
#toolbar .tb:hover { border-color:var(--accent); }
#panel-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:120; }
#panel-bg.show { display:flex; }
#panel { width:640px; max-width:94vw; max-height:86vh; overflow:hidden; display:flex; flex-direction:column; background:var(--panel2); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
#panel-head { display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); }
#panel-head b { color:var(--accent); font-size:14px; flex:1; }
#panel-close { background:none; border:0; color:var(--muted); font-size:15px; cursor:pointer; }
#panel-body { padding:12px 14px; overflow-y:auto; font-size:12.5px; }
.prow { display:flex; align-items:center; gap:8px; padding:7px 8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.pid { font-family:Consolas,monospace; color:var(--text); font-weight:bold; min-width:110px; }
.pstate { border-radius:9px; padding:0 8px; font-size:11px; }
.pstate.active { background:#e4f3e6; color:#1e7a30; }
.pstate.installed { background:#e8f0fb; color:#2258a8; }
.pstate.absent { background:#eee; color:#777; }
.pver { color:var(--muted); }
.ptools { color:var(--muted); font-size:11px; flex:1; }
.pb, #plug-load, #skill-reload, .sk-open { background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; }
.pb:hover, #plug-load:hover, #skill-reload:hover, .sk-open:hover { border-color:var(--accent); }
.pb.danger:hover { border-color:var(--danger); color:var(--danger); }
.srow { border-bottom:1px solid var(--border); padding:8px; cursor:pointer; }
.srow b { color:var(--text); font-family:Consolas,monospace; }
.srow .sdesc { color:var(--muted); font-size:12px; margin-top:2px; }
.sbody, .raw { white-space:pre-wrap; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px; margin-top:8px; max-height:280px; overflow:auto; font-family:Consolas,monospace; font-size:12px; color:var(--text); }
.mgmt-form { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px; }
.mgmt-form input, .mgmt-form select { padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text); font-size:12px; }
.mgmt-form input[name="name"] { width:110px; }
.mgmt-form input[name="expr"] { width:150px; }
.mgmt-form input[name="intent"], .mgmt-form input[name="task"] { flex:1; min-width:180px; }
.mgmt-row { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.mgmt-name { font-family:Consolas,monospace; font-weight:600; min-width:90px; }
.mgmt-meta { color:var(--muted); font-size:11px; }
.mgmt-actions { margin-left:auto; display:flex; gap:6px; }
.badge-state { border-radius:9px; padding:1px 8px; font-size:11px; background:#e8f0fb; color:#2258a8; }
.badge-state.completed { background:#e4f3e6; color:#1e7a30; }
.badge-state.failed { background:#fde8e8; color:#b42318; }
.badge-state.running { background:#fff4e5; color:#a15c00; }
.mgmt-empty { color:var(--muted); padding:12px 2px; }
</style>
</head>
<body>
<header>
  <div class="logo"><b>PyHarness</b> Desktop</div>
  <div class="sub">Agent 事件溯源 · 轨迹时间线 · 只读投影</div>
  <div id="budget-chip">预算 --</div>
  <div id="toolbar">
    <select id="preset" title="权限档位(即时生效,下轮生效)">
      <option value="strict" selected>strict 档</option>
      <option value="standard">standard 档(exec 可见)</option>
      <option value="readonly">readonly 档</option>
      <option value="locked">locked 档</option>
    </select>
    <button class="tb" id="btn-plugins" title="插件装载/热重载/卸载">🔌 插件</button>
    <button class="tb" id="btn-skills" title="技能列表/预览/重扫">📚 技能</button>
    <button class="tb" id="btn-jobs" title="后台任务启动/状态/取消">⚙ Jobs</button>
    <button class="tb" id="btn-schedules" title="定时任务注册/暂停/删除">⏱ 定时</button>
    <button class="tb" id="btn-subagents" title="子 Agent 派发/状态/取消">🧩 子 Agent</button>
    <button class="tb" id="btn-workflow" title="按有向步骤运行多段 Workflow">🧭 Workflow</button>
    <button class="tb" id="btn-settings" title="租户与模型 API Key 设置">⚙ 设置</button>
    <button class="tb" id="btn-telemetry" title="本地审计导出(遥测)">📊 审计</button>
  </div>
</header>
<main>
  <aside id="sidebar">
    <h3>会话</h3>
    <div id="session-list"><div class="sess-hint" style="padding:20px 10px;color:var(--muted);font-size:12px">加载中…</div></div>
    <button id="new-session">+ 新会话</button>
  </aside>
  <section id="chat">
    <div id="messages"></div>
    <div id="msg-ops">
      <button class="op" id="op-edit" title="编辑最后一条用户消息后重发">✎ 编辑上条</button>
      <button class="op" id="op-resend" title="重发最后一条用户消息">↻ 重发上条</button>
      <span class="op-sep"></span>
      <button class="op" id="op-up" title="给最近回复点赞">👍</button>
      <button class="op" id="op-down" title="给最近回复点踩">👎</button>
      <button class="op" id="op-flag" title="标记最近回复有问题">🚩</button>
    </div>
    <div id="input-bar">
      <button id="attach-btn" class="op" title="发送图片附件(演示:填本地图片路径)">📎</button>
      <input id="msg-input" placeholder="输入问题,回车发送…(Enter 发送)" autocomplete="off">
      <button id="send-btn">发送</button>
    </div>
  </section>
  <aside id="timeline-pane">
    <h3>Agent 轨迹时间线 <span id="tl-cursor" style="opacity:.6"></span></h3>
    <div id="timeline"></div>
  </aside>
</main>

<div id="modal-bg">
  <div id="modal">
    <h2>⚠ 工具审批请求</h2>
    <div style="font-size:12px;color:var(--muted)">Agent 请求调用工具,需要你批准或拒绝:</div>
    <div class="tool-name" id="modal-tool">—</div>
    <div class="args" id="modal-args">—</div>
    <div class="risk" id="modal-risk"></div>
    <div class="btns">
      <button id="btn-deny">拒绝</button>
      <button id="btn-approve">批准</button>
    </div>
  </div>
</div>

<div id="ask-bg">
  <div id="ask-panel">
    <h2>❓ Agent 想问你</h2>
    <div id="ask-question" style="margin:6px 0 12px;font-size:14px"></div>
    <div id="ask-options"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input id="ask-input" placeholder="或自由输入答复…" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text)">
      <button id="ask-send" style="padding:8px 14px;border-radius:8px;background:var(--accent);color:#fff;border:0;cursor:pointer">答复</button>
    </div>
    <div style="margin-top:8px;text-align:right">
      <button id="ask-skip" style="background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px">暂不答复</button>
    </div>
  </div>
</div>

<div id="session-menu"><button id="session-menu-delete">🗑 删除会话</button></div>

<div id="panel-bg">
  <div id="panel">
    <div id="panel-head"><b id="panel-title">—</b><button id="panel-close" title="关闭">✕</button></div>
    <div id="panel-body"></div>
  </div>
</div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const state = { sid: null, seq: 0, approvals: new Map(), asks: new Map(), es: null, editPending: false, draft: null, tenant: localStorage.getItem("pyharness.tenant") || "default", contextSession: null };

/* ---------- 工具 ---------- */
async function api(path, opts = {}) {
  // 桌面壳优先走 pywebview 原生桥(只读列表类);浏览器/桥失败 → 回落 HTTP
  const bridged = await bridgeCall(String(opts.method || "GET").toUpperCase(), path);
  if (bridged !== null) return bridged;
  const token = (document.querySelector('meta[name="pyharness-token"]') || {}).content || "";
  const headers = Object.assign(
    { "Content-Type": "application/json" },
    token ? { "X-PyHarness-Token": token } : {},
    { "X-PyHarness-Tenant": state.tenant },
    opts.headers || {}
  );
  const r = await fetch(path, { ...opts, headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.advice || j.code || r.status);
  return j;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

/* ---------- pywebview 原生桥(桌面壳):有则用,无则回落 HTTP ----------
   桌面程序里 window.pywebview.api = DesktopBridge(js_api),此前只挂未用(无消费者)。
   这里把只读列表类调用优先走桥(零 HTTP 往返),桥不可用/异常一律静默回落 fetch,
   所以同一份前端在浏览器与桌面壳里行为一致。 */
function bridgeApi() {
  const w = window.pywebview;
  return (w && w.api && typeof w.api.list_sessions === "function") ? w.api : null;
}
async function bridgeCall(method, path) {
  const b = bridgeApi();
  if (!b) return null;
  try {
    if (method === "GET" && path === "/api/sessions") {
      const raw = await b.list_sessions();
      const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (parsed && parsed.code) throw new Error(parsed.advice || parsed.code);
      if (parsed && Array.isArray(parsed.sessions)) {
        if (!bridgeCall._logged) { bridgeCall._logged = true; console.debug("[pyharness] 会话列表走 pywebview 原生桥"); }
        return parsed;
      }
    }
  } catch (e) {
    console.warn("[pyharness] 原生桥调用失败,回落 HTTP:", e && e.message);
  }
  return null;
}

/* ---------- 会话列表 ---------- */
async function loadSessions() {
  const d = await api("/api/sessions");
  const box = $("#session-list");
  box.innerHTML = "";
  if (!d.sessions.length) {
    box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:14px 12px">暂无会话,点下方新建</div>';
    return;
  }
  for (const s of d.sessions) {
    const sid = s.sid || s;
    const name = (s.preview || s.title || "新会话").slice(0, 24) || "新会话";
    const el = document.createElement("div");
    el.className = "sess" + (sid === state.sid ? " active" : "");
    el.title = sid;
    el.innerHTML = `<span class="dot"></span><span class="sid-name">${esc(name)}</span>`;
    el.onclick = () => selectSession(sid);
    el.oncontextmenu = (ev) => { ev.preventDefault(); ev.stopPropagation(); showSessionMenu(ev, sid, name); };
    box.appendChild(el);
  }
}

/* ---------- 会话选择 / 加载 ---------- */
async function deleteSession(sid, name) {
  if (!window.confirm(`删除会话「${name}」？该操作会永久删除本地 JSONL 记录。`)) return;
  try {
    await api(`/api/sessions/${encodeURIComponent(sid)}`, { method: "DELETE", body: "{}" });
    if (state.sid === sid) {
      if (state.es) { state.es.close(); state.es = null; }
      state.sid = null;
      $("#messages").innerHTML = "";
      $("#timeline").innerHTML = "";
    }
    await loadSessions();
    appendMsg({ role: "system", content: `🗑 会话 ${sid} 已删除` });
  } catch (e) {
    appendMsg({ role: "system", content: `⚠ 删除会话失败:${esc(e.message)}` });
  }
}

async function selectSession(sid) {
  state.sid = sid;
  state.seq = 0;
  document.querySelectorAll(".sess").forEach((e) => e.classList.toggle("active", e.title === sid));
  $("#messages").innerHTML = "";
  $("#timeline").innerHTML = "";
  const _te = document.getElementById("timeline-empty");

function fmtArgs(argsStr) {
  /* 工具参数 → 可读一行:只挑常见键,不整段 JSON */
  try {
    const a = JSON.parse(argsStr || "{}");
    const pick = ["path", "query", "url", "name", "content", "mode", "glob"];
    const parts = [];
    for (const k of pick) {
      if (a[k] !== undefined && a[k] !== null) {
        let v = String(a[k]);
        if (v.length > 24) v = v.slice(0, 24) + "…";
        parts.push(`${k}=${v}`);
      }
    }
    return parts.length ? "(" + parts.join(", ") + ")" : "";
  } catch { return ""; }
}
function fmtResult(content) {
  /* 工具结果 → 可读摘要:JSON 提要点,不整段贴 */
  const raw = String(content || "").trim();
  if (!raw) return "";
  try {
    const j = JSON.parse(raw);
    if (Array.isArray(j.entries)) {
      const names = j.entries.slice(0, 4).map(e => e.name).join(", ");
      const more = j.entries.length > 4 ? ` 等 ${j.entries.length} 项` : "";
      return `📁 ${j.entries.length} 项: ${names}${more}`;
    }
    if (typeof j.content === "string") {
      return "📄 " + (j.content.length > 40 ? j.content.slice(0, 40) + "…" : j.content);
    }
    if (typeof j.deleted === "string") return "🗑 " + j.deleted;
    if (j.ok === false || j.error) return "⚠ " + String(j.error || j.message || "失败").slice(0, 60);
    return raw.slice(0, 60) + (raw.length > 60 ? "…" : "");
  } catch { return raw.slice(0, 60) + (raw.length > 60 ? "…" : ""); }
}
function appendMsg(m) {
  const box = $("#messages");
  if (m.role === "user") {
    const el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = `<div class="who">你</div><div class="bubble">${esc(m.content ?? "")}</div>`;
    box.appendChild(el);
    return;
  }
  if (m.role === "system") {
    const el = document.createElement("div");
    el.className = "msg system";
    el.innerHTML = `<div class="bubble">${esc(m.content ?? "")}</div>`;
    box.appendChild(el);
    return;
  }
  // agent 工具轮:可读动作提示(思考过程),不贴原始 JSON
  if (m.role === "assistant" && m.tool_calls) {
    for (const tc of m.tool_calls.slice(0, 3)) {
      const fn = tc.function || {};
      const el = document.createElement("div");
      el.className = "msg tool";
      el.innerHTML = `<div class="bubble">🔧 调用工具: <b>${esc(fn.name || "")}</b> ${esc(fmtArgs(fn.arguments))}</div>`;
      box.appendChild(el);
    }
    return;
  }
  // tool 结果:可读摘要
  if (m.role === "tool") {
    const el = document.createElement("div");
    el.className = "msg tool";
    el.innerHTML = `<div class="bubble">↩ ${esc(fmtResult(m.content))}</div>`;
    box.appendChild(el);
    return;
  }
  // agent 文字回复
  const el = document.createElement("div");
  el.className = "msg agent";
  el.innerHTML = `<div class="who">Agent</div><div class="bubble">${esc(m.content ?? "") || "…"}</div>`;
  box.appendChild(el);
}

/* ---------- 轨迹时间线 ---------- */
async function loadTimeline(after = 0) {
  if (!state.sid) return;
  const d = await api(`/api/sessions/${state.sid}/timeline?after_seq=${after}`);
  const box = $("#timeline");
  if (after === 0) box.innerHTML = "";
  if (!d.nodes?.length) {
    if (!box.children.length) box.innerHTML = '<div id="timeline-empty">暂无轨迹 — 发条消息,Agent 每一步都会实时出现在这里</div>';
    return;
  }
  for (const n of d.nodes) appendNode(n);
  state.seq = Math.max(state.seq, ...d.nodes.map((n) => n.seq));
  $("#tl-cursor").textContent = `#${state.seq}`;
  box.scrollTop = box.scrollHeight;
}
function appendNode(n) {
  const box = $("#timeline");
  $("#timeline-empty")?.remove();
  const el = document.createElement("div");
  el.className = "tl-node";
  el.dataset.sev = n.severity || "info";
  el.dataset.k = n.kind;
  const detail = typeof n.detail === "string" ? n.detail : JSON.stringify(n.detail ?? {}, null, 2);
  const ts = fmtTs(n.ts);   // UTC ISO → 本地时区显示(修 8 小时差)
  el.innerHTML = `<div class="seq">${n.seq}</div>
    <div class="body">
      <div class="title">${esc(n.title)}</div>
      <div class="meta">${esc(n.kind)} · ${esc(n.actor || "")} · ${esc(ts)}</div>
      <div class="detail">${esc(detail)}</div>
    </div>`;
  el.style.cursor = "pointer";
  el.title = "点击查看/收起原始事件(完整载荷)";
  el.onclick = async (ev) => {
    el.classList.toggle("open");          // 原有折叠展开语义保留
    const raw = el.querySelector(".raw");
    if (raw) { raw.remove(); return; }
    if (!state.sid) return;
    try {
      const d = await api(`/api/sessions/${state.sid}/event/${n.seq}`);
      const pre = document.createElement("pre");
      pre.className = "raw";
      pre.textContent = JSON.stringify(d.event, null, 2);
      el.appendChild(pre);
    } catch (e) { /* 事件不可达忽略 */ }
  };
  box.appendChild(el);
}

function showModal(a) {

function fmtTs(s) {
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s).replace("T", " ").slice(5, 19);
  const p = (x) => String(x).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
/* ---------- SSE 实时流 ---------- */
function connectSSE() {
  if (state.es) state.es.close();
  const es = new EventSource(`/api/stream?sid=${state.sid}&after_seq=${state.seq}&tenant=${encodeURIComponent(state.tenant)}`);
  state.es = es;
  const refresh = async () => {
    try {
      await loadTimeline(state.seq);
      await loadChat();
      await loadBudget();
      await checkApprovals();
      await checkAsks();
    } catch (e) { /* 会话可能未就绪 */ }
  };
  es.onmessage = refresh;   // 无名消息(心跳等)
  es.addEventListener("session.created", refresh);
  es.addEventListener("llm.chunk", (evt) => {
    let d;
    try { d = JSON.parse(evt.data); } catch { return; }
    if (d.session_id && d.session_id !== state.sid) return;
    const delta = d.payload?.delta || "";
    if (!delta) return;
    let el = document.getElementById("stream-draft");
    if (!el) {
      el = document.createElement("div");
      el.id = "stream-draft";
      el.className = "msg agent";
      el.innerHTML = '<div class="who">Agent</div><div class="bubble"></div>';
      $("#messages").appendChild(el);
    }
    el.querySelector(".bubble").textContent += delta;
    $("#messages").scrollTop = $("#messages").scrollHeight;
  });
  ["user.message","agent.message","session.finished","task.completed","task.failed","tool.call","tool.result",
   "guard.rejected","approval.requested","approval.granted","approval.denied",
   "user.question","llm.usage","session.recovered"].forEach((t) => es.addEventListener(t, refresh));
  es.onerror = () => { /* 自动重连由 EventSource 内建 */ };
}

      button.onclick = async () => {
        if (!state.sid) { appendMsg({ role: "system", content: "⚠ 先新建/打开会话" }); return; }
        const name = button.dataset.name;
        try {
          const d = await api(`/api/skills/${encodeURIComponent(name)}/versions`);
          const versions = d.versions || [];
          if (!versions.length) { appendMsg({ role: "system", content: `⚠ ${name} 没有可回滚版本` }); return; }
          const suggested = versions.find((v) => v !== d.current) || versions[0];
          const version = window.prompt(`回滚 ${name}，可用版本: ${versions.join(", ")}`, suggested);
          if (!version) return;
          await api(`/api/sessions/${state.sid}/skills/${encodeURIComponent(name)}/rollback`, {
            method: "POST", body: JSON.stringify({ version }),
          });
          appendMsg({ role: "system", content: `↩ 技能 ${name} 已回滚到 ${version}` });
          loadSkillsPanel();
        } catch (e) { appendMsg({ role: "system", content: `⚠ 回滚失败:${esc(e.message)}` }); }
      };
    });
    $("#panel-body").querySelectorAll(".sk-remove").forEach((button) => {
      button.onclick = async () => {
        if (!state.sid) { appendMsg({ role: "system", content: "⚠ 先新建/打开会话" }); return; }
        const name = button.dataset.name;
        if (!window.confirm(`确认卸载技能 ${name}?`)) return;
        try {
          await api(`/api/sessions/${state.sid}/skills/${encodeURIComponent(name)}/remove`, {
            method: "POST", body: "{}",
          });
          appendMsg({ role: "system", content: `🗑 技能 ${name} 已卸载` });
          loadSkillsPanel();
        } catch (e) { appendMsg({ role: "system", content: `⚠ 卸载失败:${esc(e.message)}` }); }
      };
    });

    if (rr) rr.onclick = async () => {
      try {
        const r = await api("/api/skills/reload", { method: "POST", body: "{}" });
        appendMsg({ role: "system", content: `⟳ 技能库重扫完成: ${(r.results || []).map(x => x.count).join("/")} 个` });
        loadSkillsPanel();
      } catch (e) { appendMsg({ role: "system", content: `⚠ ${esc(e.message)}` }); }
    };
    const regSearch = document.getElementById("skill-registry-search");
    if (regSearch) regSearch.onclick = async () => {
      const url = document.getElementById("skill-registry-url").value.trim();
      const query = document.getElementById("skill-registry-query").value.trim();
      const box = document.getElementById("skill-registry-results");
      if (!url) { box.innerHTML = "<div class='mgmt-empty'>请先填写 Registry URL。</div>"; return; }
      localStorage.setItem("pyharness.skillRegistryUrl", url);
      box.innerHTML = "<div class='mgmt-empty'>搜索中…</div>";
      try {
        const r = await api(`/api/skills/registry/search?q=${encodeURIComponent(query)}&registry_url=${encodeURIComponent(url)}`);
        if (!(r.skills || []).length) { box.innerHTML = "<div class='mgmt-empty'>没有匹配技能。</div>"; return; }
        let rows = "";
        for (const sk of r.skills) {
          const versions = sk.versions || [];
          const options = versions.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
          rows += `<div class='mgmt-row reg-skill' data-name="${esc(sk.name)}">` +
            `<span class='mgmt-name'>${esc(sk.name)}</span>` +
            `<span class='mgmt-meta'>${esc(sk.description || "")}${sk.sha256 ? ` · sha256 ${esc(String(sk.sha256).slice(0, 12))}…` : ""}</span>` +
            `<select class='reg-version' data-name="${esc(sk.name)}">${options}</select>` +
            `<span class='mgmt-actions'><button class='pb reg-install' data-name="${esc(sk.name)}">安装</button></span></div>`;
        }
        box.innerHTML = rows;
        box.querySelectorAll(".reg-install").forEach((button) => {
          button.onclick = async () => {
            if (!state.sid) { appendMsg({ role: "system", content: "⚠ 先新建/打开会话" }); return; }
            const name = button.dataset.name;
            const select = Array.from(box.querySelectorAll(".reg-version"))
              .find((el) => el.dataset.name === name);
            const version = select ? select.value : "";
            if (!window.confirm(`安装技能 ${name} ${version}?`)) return;
            try {
              await api(`/api/sessions/${state.sid}/skills/install`, {
                method: "POST", body: JSON.stringify({ name, version, registry_url: url }),
              });
              appendMsg({ role: "system", content: `✅ 技能 ${name} ${version} 已安装并启用` });
              loadSkillsPanel();
            } catch (e) { appendMsg({ role: "system", content: `⚠ 安装失败:${esc(e.message)}` }); }
          };
        });
      } catch (e) { box.innerHTML = `<div>⚠ ${esc(e.message)}</div>`; }
    };
  } catch (e) { $("#panel-body").innerHTML = `<div>⚠ ${esc(e.message)}</div>`; }
}

/* ---------- 编排管理:Jobs / 定时 / 子 Agent ---------- */
function requirePanelSession() {
  if (!state.sid) {
    appendMsg({ role: "system", content: "⚠ 先新建/打开会话" });
    return false;
  }
  return true;
}
function fmtMs(ms) {
  if (ms == null) return "—";
  return ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`;
}
async function loadJobsPanel() {
  if (!requirePanelSession()) return;
  panelShow("后台任务 Jobs(启动 / 状态 / 取消)", "<div style='color:var(--muted)'>加载中…</div>");
  try {
    const d = await api(`/api/sessions/${state.sid}/jobs`);
    let h = "<div class='mgmt-form'>" +
      "<input name='intent' id='job-intent' placeholder='后台任务意图,例如:整理今天的待办并总结'>" +
      "<button class='pb' id='job-start'>启动 Job</button>" +
      "<button class='pb' id='job-refresh'>刷新</button></div>";
    if (!(d.jobs || []).length) h += "<div class='mgmt-empty'>暂无后台任务</div>";
    for (const j of (d.jobs || [])) {
      const active = ["queued", "running", "suspended"].includes(j.state);
      const err = j.error ? ` · ${esc(j.error)}` : "";
      h += `<div class="mgmt-row"><span class="mgmt-name">${esc(j.job_id)}</span>` +
        `<span class="badge-state ${esc(j.state)}">${esc(j.state)}</span>` +
        `<span class="mgmt-meta">${esc(j.todo_summary || "0/0 项")} · ${fmtMs(j.elapsed_ms)}${err}</span>` +
        `<span class="mgmt-actions">${active ? `<button class="pb danger" data-job-op="cancel" data-id="${esc(j.job_id)}">取消</button>` : ""}</span></div>`;
    }
    $("#panel-body").innerHTML = h;
    const jr = document.getElementById("job-refresh");
    if (jr) jr.onclick = loadJobsPanel;
    const start = document.getElementById("job-start");
    if (start) start.onclick = async () => {
      const intent = document.getElementById("job-intent").value.trim();
      if (!intent) return;
      try {
        const r = await api(`/api/sessions/${state.sid}/jobs`, { method: "POST", body: JSON.stringify({ intent }) });
        appendMsg({ role: "system", content: `⚙ Job ${r.job_id} 已启动` });
        loadJobsPanel();
      } catch (e) { appendMsg({ role: "system", content: `⚠ 启动 Job 失败:${esc(e.message)}` }); }
    };
    $("#panel-body").querySelectorAll("[data-job-op=cancel]").forEach((b) => b.onclick = async () => {
      try {
        await api(`/api/sessions/${state.sid}/jobs/${encodeURIComponent(b.dataset.id)}/cancel`, { method: "POST", body: "{}" });
        loadJobsPanel();
      } catch (e) { appendMsg({ role: "system", content: `⚠ 取消 Job 失败:${esc(e.message)}` }); }
    });
  } catch (e) { $("#panel-body").innerHTML = `<div>⚠ ${esc(e.message)}</div>`; }
}
async function loadSchedulePanel() {
  if (!requirePanelSession()) return;
  panelShow("定时任务(注册 / 暂停 / 恢复 / 删除)", "<div style='color:var(--muted)'>加载中…</div>");
  try {
    const d = await api(`/api/sessions/${state.sid}/schedules`);
    let h = "<div class='mgmt-form'>" +
      "<input name='name' id='sch-name' placeholder='name'>" +
      "<select id='sch-kind'><option value='cron'>cron</option><option value='interval'>interval</option><option value='at'>at</option></select>" +
      "<input name='expr' id='sch-expr' placeholder='0 9 * * * / 3600 / 2026-09-12T09:00:00'>" +
      "<input name='intent' id='sch-intent' placeholder='到点要执行的意图'>" +
      "<select id='sch-risk'><option value='auto'>自动判险</option><option value='safe'>非危险</option><option value='risky'>危险</option></select>" +
      "<button class='pb' id='sch-add'>新增</button>" +
      "<button class='pb' id='sch-refresh'>刷新</button></div>";

      h += `<div class="mgmt-row"><span class="mgmt-name">${esc(j.name)}</span>` +
        `<span class="badge-state ${j.paused ? "failed" : "running"}">${j.paused ? "paused" : "active"}</span>` +
        `<span class="mgmt-meta">${esc(j.kind)} ${esc(j.expr)} · next ${esc(j.next_fire_at || "—")} · 触发 ${j.triggered} / 错过 ${j.missed}</span>` +
        `<span class="mgmt-actions"><button class="pb" data-sch-op="${j.paused ? "resume" : "pause"}" data-name="${esc(j.name)}">${j.paused ? "恢复" : "暂停"}</button>` +
        `<button class="pb danger" data-sch-op="remove" data-name="${esc(j.name)}">删除</button></span></div>`;
    }
    $("#panel-body").innerHTML = h;
    const sr = document.getElementById("sch-refresh");
    if (sr) sr.onclick = loadSchedulePanel;
    const add = document.getElementById("sch-add");
    if (add) add.onclick = async () => {
      const risk = document.getElementById("sch-risk").value;
      const body = {
        action: "add",
        name: document.getElementById("sch-name").value.trim(),
        kind: document.getElementById("sch-kind").value,
        expr: document.getElementById("sch-expr").value.trim(),
        intent: document.getElementById("sch-intent").value.trim(),
        is_risky: risk === "auto" ? null : risk === "risky",
      };
      if (!body.name || !body.expr || !body.intent) return;
      try {
        await api(`/api/sessions/${state.sid}/schedules/action`, { method: "POST", body: JSON.stringify(body) });

        loadSchedulePanel();
      } catch (e) { appendMsg({ role: "system", content: `⚠ 注册定时任务失败:${esc(e.message)}` }); }
    };
    $("#panel-body").querySelectorAll("[data-sch-op]").forEach((b) => b.onclick = async () => {
      try {
        await api(`/api/sessions/${state.sid}/schedules/action`, { method: "POST",
          body: JSON.stringify({ action: b.dataset.schOp, name: b.dataset.name }) });
        loadSchedulePanel();
      } catch (e) { appendMsg({ role: "system", content: `⚠ 定时任务操作失败:${esc(e.message)}` }); }
    });

      "<button class='pb' id='sub-refresh'>刷新</button></div>" +
      `<div class='mgmt-meta'>运行中 ${st.running || 0} / 上限 ${st.limit || 8}</div>`;

    for (const c of rows) {
      h += `<div class="mgmt-row"><span class="mgmt-name">${esc(c.sub_id)}</span>` +

    $("#panel-body").innerHTML = h;
    const sbr = document.getElementById("sub-refresh");
    if (sbr) sbr.onclick = loadSubagentsPanel;

        temperature: Number(document.getElementById("mp-temperature").value || 0.7),
        max_tokens: Number(document.getElementById("mp-max-tokens").value || 4096),
        fallback_models: document.getElementById("mp-fallbacks").value.split(",").map(x => x.trim()).filter(Boolean),
      };
      try {
        const r = await api("/api/settings/models", { method: "POST", body: JSON.stringify(body) });
        document.getElementById("settings-note").textContent = r.restart_required ? "已保存。当前已有引擎运行，重启程序后生效。" : "已保存并将在新会话中生效。";
        loadSettingsPanel();
      } catch (e) { alert(`保存失败: ${e.message}`); }
    };
  } catch (e) { $("#panel-body").innerHTML = `<div>⚠ ${esc(e.message)}</div>`; }
}

/* ---------- Workflow ---------- */
async function loadWorkflowPanel() {
  if (!requirePanelSession()) return;
  panelShow("Workflow(每行一个执行意图)",
    "<div class='mgmt-form'><input id='wf-name' value='desktop' placeholder='workflow 名称'>" +
    "<label style='display:flex;align-items:center;gap:5px'><input type='checkbox' id='wf-stop'> 首步失败即停止</label>" +
    "<button class='pb' id='wf-run'>运行</button></div>" +
    "<textarea id='wf-steps' placeholder='读取 README\n总结项目能力' style='width:100%;height:160px;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:Consolas,monospace'></textarea>" +
    "<pre id='wf-result' class='raw' style='margin-top:10px'>尚未运行</pre>");
  const run = document.getElementById("wf-run");
  if (!run) return;
  run.onclick = async () => {
    const steps = document.getElementById("wf-steps").value.split("\n").map(x => x.trim()).filter(Boolean);
    if (!steps.length) return;
    const result = document.getElementById("wf-result");
    result.textContent = "运行中…";
    try {
      const d = await api(`/api/sessions/${state.sid}/workflow`, {
        method: "POST", body: JSON.stringify({
          name: document.getElementById("wf-name").value.trim() || "desktop",
          stop_on_fail: document.getElementById("wf-stop").checked,
          steps,
        }),
      });
      result.textContent = JSON.stringify(d, null, 2);
    } catch (e) { result.textContent = `⚠ ${e.message}`; }
  };
}

/* ---------- 启动 ---------- */
(async function boot() {
  try {
    await loadSessions();
    if (state.sid) { await selectSession(state.sid); return; }
    /* 无会话:建一个演示会话(标题问候),前端立即可用 */
    newSession();
  } catch (e) {
    $("#messages").innerHTML = `<div class="msg system"><div class="bubble">⚠ 启动失败:${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
