<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>PyHarness 登录</title>
<style>body{font:16px system-ui;background:#f5f7fb;color:#142039;max-width:400px;margin:12vh auto;padding:24px}form{background:white;padding:28px;border-radius:16px}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px}button{background:#1670ff;color:white;border:0;border-radius:8px}</style>
<h1>PyHarness</h1><form id="login"><h2>登录团队工作区</h2><label>账户<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><label>团队 ID（可选）<input name="tenant" maxlength="64"></label><button>登录</button><p id="status" role="status"></p></form>
<p>本地操作者：请使用应用启动时自动打开的页面；访问失效时，从当前安装环境用 <code>--open-browser</code> 重新打开。不要分享访问令牌。</p><script>document.querySelector('form').onsubmit=async event=>{event.preventDefault();const f=event.target,b=f.querySelector('button'),s=document.querySelector('#status');b.disabled=true;try{const values=Object.fromEntries(new FormData(f));if(!values.tenant)delete values.tenant;const r=await fetch('/api/account/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});f.password.value='';if(r.ok)location.replace('/');else s.textContent=r.status===429?'尝试过多，请稍后重试':'登录失败，请检查账户、密码和团队'}catch{s.textContent='连接失败，请重试'}finally{b.disabled=false}};</script></html>
