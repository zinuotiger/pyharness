[project]
name = "pyharness"
version = "0.1.0"
description = "DSH 架构思想的 Python 复刻 - Agent 框架(66 功能/6 阶段)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "pywebview>=5.0",
    "fastapi>=0.110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --cov=pyharness --cov-report=term-missing"
markers = [
    "e2e: 真实 LLM/网络测试,默认跳过(手动 -m e2e 运行)",
    "invariant: 全库不变量测试(INV-01~09)",
]
