async function api(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),path.endsWith('/test')?70000:30000);try{let r;try{r=await fetch(path,{credentials:'same-origin',...options,signal:options.signal||controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}})}catch(cause){const e=Error(cause.name==='AbortError'?'请求超时':'无法连接本地服务');e.code=cause.name==='AbortError'?'request_timeout':'network_unavailable';throw e}if(r.status===204)return null;let data;try{data=await r.json()}catch{const e=Error(`HTTP ${r.status}：响应不是 JSON`);e.code='invalid_response';e.status=r.status;throw e}if(!r.ok){const accountMessages={account_role_required:'当前账户没有执行此操作的权限。模型连接由团队管理员管理，请联系管理员。',account_read_only:'当前账户为只读角色，没有修改权限。请联系团队管理员。',account_tenant_mismatch:'当前账户无权访问其他团队的数据，请检查登录的团队。',account_operator_api:'此操作仅向本地操作者开放，团队账户没有访问权限。',account_operator_connection:'此连接仅由本地操作者管理，团队账户没有修改权限。'};const e=Error(`${data.code||r.status}：${authFailureMessage(data)||accountMessages[data.code]||(r.status===403?'当前账户没有执行此操作的权限。请联系团队管理员。':data.message||data.advice||data.detail||'请求失败')}`);e.code=data.code;e.status=r.status;throw e}return data}finally{clearTimeout(timer)}}
function feedbackFor(error){const code=error.code||'',status=error.status;let text=error.message||'提交失败',action='';if(['model_not_configured','model_connection_missing','model_credential_missing','tenant_model_profile_required'].includes(code)){text=code==='model_connection_missing'?'该 Agent 绑定的模型连接已不存在。请在设置中检查连接，并创建使用有效配置的 Agent 版本和新会话。':'当前没有可用的模型配置。请在设置 → 模型配置中添加并启用连接，再发送任务。';action='models'}else if(status===401){text='身份已失效或模型凭据不可用。请先重新登录；若已登录，请检查模型连接。草稿已保留。';action='login'}else if(status===403){text='当前账户没有发送或访问这个会话的权限。请联系团队管理员检查角色。'}else if(['request_timeout','network_unavailable','invalid_response'].includes(code)){text='提交结果尚未确认：'+text+'。草稿已保留；请先检查任务中心，确认是否已有 Run，再决定是否重发。';action='runs'}else if(status===429){text='当前请求或团队配额达到限制，请稍后检查用量与活动任务。';action='runs'}return {text,action,error:true}}

let panelStack=[],pendingConfirmation=null,presentation=0;
function resetPanels(){presentation++;panelStack=[];if(pendingConfirmation){const resolve=pendingConfirmation;pendingConfirmation=null;resolve(false)}}
function closePanel(){
 presentation++;
 if(pendingConfirmation){const resolve=pendingConfirmation;pendingConfirmation=null;resolve(false)}
 const previous=panelStack.pop(),pane=$('.settings-content');
 if(previous&&pane){pane.replaceChildren(previous.nodes);pane.setAttribute('aria-label',previous.label);previous.focus?.focus({preventScroll:true});return}
 $('#dialog').close();
}
function modal(name,html,{replace=false,variant=''}={}){
 const pane=$('.settings-content');presentation++;
 if(pane){
  if(!replace){const nodes=document.createDocumentFragment();const focus=pane.contains(document.activeElement)?document.activeElement:null;const label=pane.getAttribute('aria-label');while(pane.firstChild)nodes.append(pane.firstChild);panelStack.push({nodes,label,focus})}
  const parent=panelStack.at(-1)?.label||'设置';
  pane.setAttribute('aria-label',name);
  pane.innerHTML=variant==='model'?`<header class="model-editor-heading"><div><p>设置 / 模型配置</p><h1 tabindex="-1">${esc(name)}</h1></div><button type="button" data-action="panel-back">返回模型配置</button></header><section class="model-editor">${html}</section>`:`<div class="settings-content-toolbar"><span>设置 / ${esc(parent)} / ${esc(name)}</span><button type="button" data-action="panel-back">返回${esc(parent)}</button></div><div class="page-title"><div><h1 tabindex="-1">${esc(name)}</h1></div></div><section class="card settings-editor">${html}</section>`;
  pane.querySelector('h1').focus({preventScroll:true});
 }else{$('#dialogTitle').textContent=name;$('#dialogBody').innerHTML=html;$('#dialog').showModal()}
 return presentation;
}
function confirmAction(message){
 if(!$('.settings-content'))return Promise.resolve(window.confirm(message));
 if(pendingConfirmation)return Promise.resolve(false);
 return new Promise(resolve=>{
  modal('确认操作',`<p>${esc(message)}</p><div class="toolbar settings-confirm-actions"><button type="button" class="primary" id="confirmProceed">确认继续</button><button type="button" id="confirmCancel">取消</button></div>`);
  pendingConfirmation=resolve;
  const finish=value=>{pendingConfirmation=null;closePanel();resolve(value)};
  $('#confirmProceed').onclick=()=>finish(true);$('#confirmCancel').onclick=()=>finish(false);
 });
}

function sessionDateGroup(s){
 const value=s.updated??s.created,stamp=new Date(typeof value==='number'&&value<1e12?value*1000:value);
 if(value===null||value===undefined||Number.isNaN(stamp.getTime()))return '其他会话';
 const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),yesterday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);

function wireScheduleForm(){
 const form=$('#scheduleForm');if(!form)return;
 // The route owns the heading, so remove the list-level toolbar from this form page.
 form.closest('.settings-content').querySelector('.settings-content-toolbar')?.remove();
 let busy=false;
 const status=form.querySelector('[role=status]'),error=form.querySelector('[role=alert]'),button=form.querySelector('[type=submit]');
 const feedback=(text,failed=false)=>{status.hidden=failed||!text;error.hidden=!failed;status.textContent=failed?'':text;error.textContent=failed?text:'';};
 form.onsubmit=async event=>{
  event.preventDefault();if(busy)return;
  if(!form.checkValidity()){const invalid=form.querySelector(':invalid');feedback(invalid.validationMessage,true);invalid.focus();return;}
  if(!form.elements.intent.value.trim()){feedback('请输入执行意图。',true);form.elements.intent.focus();return;}
  const [agent_id,version]=form.elements.agent.value.split('~');
  const body={action:'add',agent_id:agent_id||null,agent_version:Number(version)||null,name:form.elements.name.value,kind:'interval',expr:form.elements.expr.value,intent:form.elements.intent.value};
  busy=true;form.setAttribute('aria-busy','true');form.querySelectorAll('input,select,textarea,button').forEach(el=>el.disabled=true);button.textContent='正在创建…';feedback('正在创建计划任务，请勿重复提交…');
  try{await post('schedules',body);if(form.isConnected)go('schedules');}
  catch(cause){if(form.isConnected)feedback('创建失败：'+cause.message,true);}
  finally{busy=false;form.setAttribute('aria-busy','false');form.querySelectorAll('input,select,textarea,button').forEach(el=>el.disabled=false);button.textContent='创建';}
 };
}

let draftNamespace=null;
function saveDrafts(){if(!draftNamespace)return;try{const drafts={};for(const [sid,v] of Object.entries(state.composers||{}))drafts[sid]={text:v.text||'',agent:v.agent||'',version:v.version||null,attachments:v.attachments||[],files:v.files||{},vision:v.vision===true,uploads:(v.uploads||[]).filter(x=>x.status!=='done').map(x=>({id:x.id,name:x.name,size:x.size,status:'failed',error:'刷新后请重新选择文件'}))};sessionStorage.setItem(draftNamespace,JSON.stringify({sid:state.sid,drafts}));}catch{/* Private mode or quota: current draft stays in memory. */}}
async function loadDrafts(){try{const who=await api('/api/account/me'),a=who.account;draftNamespace='pyharness.drafts.v1:'+JSON.stringify(a?[a.tenant,a.user_id||a.username]:['local']);const saved=JSON.parse(sessionStorage.getItem(draftNamespace)||'{}');const sessions=await get('sessions'),allowed=new Set(sessions.sessions.map(x=>x.sid));state.composers={};for(const [sid,v] of Object.entries(saved.drafts||{})){if((sid==='__new__'||allowed.has(sid))&&typeof v.text==='string'&&Array.isArray(v.attachments)){state.composers[sid]={...v,text:v.text.slice(0,32000),attachments:v.attachments.filter(x=>typeof x==='string').slice(0,10),pending:false};}}if(allowed.has(saved.sid))state.sid=saved.sid;}catch{/* Application remains usable without persisted drafts. */}}

async function uploadAttachment(file,sid=state.sid,retryId=null){if(file.size>10*1024*1024)throw Error('文件上限 10 MB');if(!sid){rememberCompose();sid=(await post('sessions')).sid;if(!state.sid){state.composers[sid]=composer(null);state.sid=sid;}}const owner=composer(sid);owner.uploads??=[];owner.files??={};if(!retryId&&owner.attachments.length+owner.uploads.filter(x=>x.status!=='done').length>=10)throw Error('每条消息最多 10 个附件');const row=retryId?owner.uploads.find(x=>x.id===retryId):{id:crypto.randomUUID(),name:file.name,size:file.size};if(!row||row.status==='uploading')return;if(!retryId)owner.uploads.push(row);row.file=file;row.status='uploading';row.error='';saveDrafts();if(state.sid===sid)drawAttachments();try{const bytes=new Uint8Array(await file.arrayBuffer());let text='';for(let i=0;i<bytes.length;i+=8192)text+=String.fromCharCode(...bytes.subarray(i,i+8192));const item=await post('artifacts',{session_id:sid,filename:file.name,data_base64:btoa(text)});if(!owner.uploads.includes(row))return;owner.attachments.push(item.artifact_id);owner.files[item.artifact_id]={artifact_id:item.artifact_id,filename:item.filename,size:item.size,preview_type:item.preview_type};row.status='done';delete row.file;toast('附件已保存到所属会话；图片需勾选视觉输入才发送给模型');}catch(error){row.status='failed';row.error=error.message;toast(error.message);}finally{saveDrafts();if(state.sid===sid){if(!$('#compose'))await render();else restoreCompose();}}}

function restoreCompose(){const form=$('#compose');if(!form)return;form.dataset.sid=state.sid||'';const saved=composer();$('#messageText').value=saved.text;$('#sendFeedback').innerHTML=feedbackHTML(saved.feedback);$('#agentSelect').value=saved.agent;form.querySelector('button[type=submit]').disabled=!!saved.pending;const label=$('#attachmentCount');if(label)label.textContent=saved.attachments.length?String(saved.attachments.length):'';if($('#useVision'))$('#useVision').checked=saved.vision===true;drawAttachments();chatControls.sync();resizeComposer()}

function disconnectStream(){if(state.stream){state.stream.close();state.stream=null}clearTimeout(state.refreshTimer)}
function connectStream(sid){if(state.stream?.sid===sid)return;disconnectStream();const stream=new EventSource(`/api/stream?sid=${encodeURIComponent(sid)}`);stream.sid=sid;state.stream=stream;const refresh=()=>{if(state.sid!==sid)return;clearTimeout(state.refreshTimer);state.refreshTimer=setTimeout(async()=>{if(state.page==='chat'){if(state.composing)state.refreshAfterComposition=true;else await render(true)}},500)};['system.error','llm.error','task.started','task.completed','task.failed','agent.message','tool.result','tool.error','approval.requested','approval.granted','approval.denied','approval.timeout','approval.reviewed','platform.artifact','user.question','user.answer','subagent.spawned','subagent.joined','subagent.failed'].forEach(k=>stream.addEventListener(k,refresh));stream.onopen=refresh;stream.onerror=()=>{if(state.sid===sid)toast('连接中断，正在恢复；重连后重新读取持久化消息')};stream.addEventListener('llm.chunk',event=>{try{const e=JSON.parse(event.data),delta=e.payload?.delta||e.delta||'';let draft=$('#streamDraft');if(!draft){draft=document.createElement('div');draft.id='streamDraft';draft.className='message';$('#messages')?.append(draft)}draft.textContent+=delta}catch(e){console.error('SSE 数据错误',e)}})}

 form.onsubmit=async event=>{event.preventDefault();if(form.dataset.pending)return;const title=form.elements.title.value.trim(),error=$('#sessionRenameError');error.hidden=true;if(!title){error.textContent='会话名称不能为空';error.hidden=false;return}form.dataset.pending='1';form.querySelectorAll('button').forEach(b=>b.disabled=true);try{await post('sessions/'+encodeURIComponent(id)+'/metadata',{title});if(form.isConnected)closePanel();await render();toast('会话已重命名')}catch(err){if(form.isConnected){error.textContent=err.message;error.hidden=false}else toast(err.message)}finally{delete form.dataset.pending;form.querySelectorAll('button').forEach(b=>b.disabled=false)}};

actions['session-delete']=async id=>{
 closeSessionMenu();
 state.sessionDeletes??=new Set();if(state.sessionDeletes.has(id))return;
 const row=(await get('sessions')).sessions.find(s=>s.sid===id);
 if(!row){await render();toast('会话已不存在');return}
 modal('删除会话',`<form id="sessionDeleteForm"><p>确定删除「${esc(row.title||'未命名会话')}」及其关联文件？此操作不能在当前页面撤销。</p><p class="muted" style="margin:12px 0">运行中或等待处理的会话，请先完成或取消任务。</p><p id="sessionDeleteError" role="alert" class="failure" hidden></p><div class="toolbar"><button type="submit" class="danger">确认删除</button><button type="button" id="sessionDeleteCancel">取消</button></div></form>`);
 const form=$('#sessionDeleteForm');$('#sessionDeleteCancel').onclick=()=>closePanel();
 form.onsubmit=async event=>{
  event.preventDefault();if(state.sessionDeletes.has(id))return;
  const error=$('#sessionDeleteError'),draft=state.composers?.[id];error.hidden=true;
  if(draft?.pending||(draft?.uploads||[]).some(x=>x.status==='uploading')){error.textContent='会话正在提交任务或上传文件，请等待完成后再删除。';error.hidden=false;return}
  state.sessionDeletes.add(id);form.querySelectorAll('button').forEach(b=>b.disabled=true);rememberCompose();
  try{
   await api('/api/sessions/'+encodeURIComponent(id),{method:'DELETE'});
   if(form.isConnected)closePanel();
   if(state.sid===id){disconnectStream();++state.generation;main.innerHTML='';state.sid=null;state.run=null;state.bound=false;state.refreshAfterComposition=false;state.composing=false;document.body.classList.remove('sessions-open')}
   if(state.composers)delete state.composers[id];saveDrafts();
   await render();toast('会话已删除');
  }catch(err){if(form.isConnected){error.textContent=err.code==='BUSY'?'会话仍有运行或等待任务，请完成或取消后再删除。':err.message;error.hidden=false}else toast(err.message)}
  finally{state.sessionDeletes.delete(id);form.querySelectorAll('button').forEach(b=>b.disabled=false)}
 };
};

const globalSearchResults=document.createElement('section');
globalSearchResults.id='globalSearchResults';globalSearchResults.className='global-search-results';

const globalSearchState={generation:0,timer:null};
function closeGlobalSearch(focus=false){
 clearTimeout(globalSearchState.timer);globalSearchState.generation++;
 globalSearchResults.hidden=true;$('#globalSearch').setAttribute('aria-expanded','false');
 if(focus){globalSearchState.suppressFocus=true;$('#globalSearch').focus();globalSearchState.suppressFocus=false}
}
function positionGlobalSearch(){
 if(globalSearchResults.hidden)return;
 const rect=$('.header .search').getBoundingClientRect(),width=Math.min(Math.max(rect.width,360),innerWidth-24),left=Math.max(12,Math.min(rect.left,innerWidth-width-12));
 globalSearchResults.style.width=width+'px';globalSearchResults.style.left=left+'px';globalSearchResults.style.top=(rect.bottom+8)+'px';globalSearchResults.style.maxHeight=Math.max(120,innerHeight-rect.bottom-20)+'px';
}
async function searchGlobal(full=false){
 clearTimeout(globalSearchState.timer);
 const query=$('#globalSearch').value.trim();if(!query){closeGlobalSearch();return}
 const generation=++globalSearchState.generation;
 globalSearchResults.hidden=false;$('#globalSearch').setAttribute('aria-expanded','true');positionGlobalSearch();
 globalSearchResults.innerHTML='<p class="search-status" role="status">正在搜索…</p>';
 const valid=()=>generation===globalSearchState.generation&&query===$('#globalSearch').value.trim();
 try{
  const [sessions,history]=await Promise.allSettled([get('sessions'),full&&query.length>=2?get('history/search?'+new URLSearchParams({q:query})):Promise.resolve(null)]);
  if(!valid())return;
  if(sessions.status==='rejected')throw sessions.reason;
  const rows=sessions.value.sessions,needle=query.toLocaleLowerCase(),hits=history.status==='fulfilled'?history.value?.hits||[]:[];
  const snippets=new Map();for(const hit of hits){if(!snippets.has(hit.session_id))snippets.set(hit.session_id,hit.snippet)}
  const matches=rows.filter(s=>[s.title||'未命名会话',s.sid,...(s.tags||[])].some(v=>String(v).toLocaleLowerCase().includes(needle))||snippets.has(s.sid));
  const destinations=[...new Map([...pages,...settingsGroups.flatMap(([,items])=>items)].map(p=>[p[0],p])).values()].filter(p=>p[1].includes(query));
  globalSearchResults.innerHTML=`<div class="search-results-heading"><strong>搜索结果</strong><button type="button" data-action="search-close" aria-label="关闭搜索结果">×</button></div>
   ${matches.length?`<p class="search-group-label">会话 · ${matches.length}</p>${matches.slice(0,30).map(s=>`<a href="#chat" class="search-session-result" data-session="${esc(s.sid)}">${icon('chat')}<span class="search-result-copy"><strong title="${esc(s.title||'未命名会话')}">${esc(s.title||'未命名会话')}</strong>${snippets.has(s.sid)?`<span class="search-snippet">${esc(snippets.get(s.sid))}</span>`:''}<small>${s.archived?'已归档 · ':s.pinned?'已置顶 · ':''}${date(s.updated)}</small></span></a>`).join('')}`:'<p class="search-status">没有匹配的会话</p>'}
   ${destinations.length?`<p class="search-group-label">页面入口</p>${destinations.map(([id,label,i])=>`<a href="#${esc(id)}" data-nav="${esc(id)}">${icon(i)}<span>${esc(label)}</span></a>`).join('')}`:''}
   ${matches.length>30?'<p class="search-status">显示前 30 条，请输入更具体的关键词。</p>':''}
   ${history.status==='rejected'?`<p class="search-status" role="alert">内容搜索失败：${esc(history.reason.message)}</p>`:''}
   ${history.status==='fulfilled'&&history.value?.timed_out?'<p class="search-status" role="status">内容搜索超时，请缩小搜索范围重试。</p>':''}
   ${history.status==='fulfilled'&&history.value?.truncated?'<p class="search-status">历史内容仅检索最近 100 个会话。</p>':''}
   ${!full&&query.length>=2?'<button type="button" class="search-full" data-action="search-history">按 Enter 搜索会话内容</button>':''}`;
 }catch(error){if(valid())globalSearchResults.innerHTML=`<p class="search-status" role="alert">${esc(error.message)}</p><button type="button" class="search-full" data-action="search-history">重试搜索</button>`}
}

 if(event.isComposing||event.keyCode===229)return;

 else if(event.key==='Escape'){event.preventDefault();closeGlobalSearch()}
 else if(event.key==='ArrowDown'&&!globalSearchResults.hidden){event.preventDefault();globalSearchResults.querySelector('a')?.focus()}
};

 if(event.key==='Escape'){event.preventDefault();closeGlobalSearch(true);return}
 const items=[...globalSearchResults.querySelectorAll('a')],index=items.indexOf(document.activeElement);
 if(['ArrowDown','ArrowUp'].includes(event.key)&&items.length){event.preventDefault();items[(index+(event.key==='ArrowDown'?1:items.length-1))%items.length].focus()}
};
